{
  title:'[心得] 我把兩位的庭審紀錄全翻一遍想抓放水 結果', au:'case_digger', nick:'翻紀錄的人', date:'06/10', t:[22,15],
  body:`官宣之後，推特上有人說：「那些年的對決搞不好都是演的，利益輸送啦。」
我這個人比較頭鐵，所以把他們兩位所有的公開庭審紀錄調出來了。
目標：找放水的證據。
範圍：兩人對決過的全部場次，約三週，工作日晚上加週末。

結果先講：
1. 沒有放水。
2. 一點都沒有。
3. 我現在有點同情成步堂律師。

幾個我抄下來的片段：
・證人證詞講到一半，御劍檢察官：「律師，請不要斷章取義。證人的完整證詞是——」然後一條一條把成步堂律師的論點拆掉，成步堂律師捶桌。
・成步堂律師拿出證物，御劍檢察官：「等等，律師，你確定要這樣說嗎？」推眼鏡，「那我只好指出這個證物的矛盾之處了。」逐條駁斥。
・成步堂律師被逼到只能翻文件，御劍檢察官看著他翻，沒有出手幫忙，沒有延長時間，也沒有放過任何一個可以問的問題。
・休庭前最後一句：「成步堂律師，你今天的表現——退步了。」

我最後的統計：
・成步堂律師捶桌次數：多到我放棄數
・御劍檢察官嘴角上揚的次數：我數了，比我想的多很多，而且每次都是成步堂律師被逼到最難堪的時候

我開始懷疑他是不是很享受。

補充：檢方席和辯方席之間，我沒有看到任何一次「互相讓步」、「點到為止」。
有的只是兩個人用盡全力想把對方逼到沒有退路。

我認輸。這兩個人如果有放水，太陽就是從西邊升起的。

: 時間: 去年 12/06
:

: 週刊今天刊出一張照片：御劍檢察官緊抓著成步堂律師的西裝，臉埋在他肩上，

:

{
  title:'[整理] 「驕傲.jpg」誕生經過 (官宣後重看)', au:'gif_maker', nick:'表情包剪輯', date:'06/12', t:[20,10],
  body:`官宣之後有人問我：那張「驕傲.jpg」到底是怎麼來的？
整理給新人。

去年 12 月，御劍檢察官的記者會。他在回答「這是不是司法界的醜聞」那一段：
「這怎麼會是『我的』醜聞？」
「如果非要說這是醜聞，那也是媒體的醜聞。」

鏡頭偶爾會掃到旁邊的成步堂律師。
他坐得筆直，一臉「我是陪同出席的辯護律師」的專業表情。

然後御劍檢察官說到「所有開庭都有公開紀錄，任何一絲放水的蛛絲馬跡我都願意接受批評」的時候：
・成步堂律師的嘴角往上動了一下
・很小聲地「哼」了一聲
・下巴往御劍檢察官的方向，輕輕點了一下
・發現自己失態，立刻恢復嚴肅臉

全程大約 0.5 秒。被一位眼尖的網友截下來了。

這就是「驕傲.jpg」的由來。

用法：
「我男友今天升職了」＋驕傲.jpg
「我家姊姊論文發表了」＋驕傲.jpg

  title:'[整理] 旁聽登記：御劍檢察官專程 vs 成步堂律師順路', au:'case_digger', nick:'翻紀錄的人', date:'06/14', t:[22,5],
  body:`前幾天發過我去翻庭審紀錄想抓放水，結果沒抓到。
這次是另一件事：我順便去翻了法院的旁聽登記與監視器公開片段。

【御劍檢察官旁聽成步堂律師開庭】
・2018 年 3 月：全程。提前約 15 分鐘到，坐最後一排，看到成步堂律師做出關鍵反轉時，嘴角上揚。
・2019 年 10 月：全程。最後一排，同上。
・2026 年 4 月：成步堂律師恢復律師資格後的第一場開庭，全程。最後一排。

  body:`官宣後整理舊資料，翻到前年我自己翻譯過的一篇海外論壇串。
英文原串，內容是一位不嗑這對的網友發問。

※ 引述《archive_digger》之銘言：
: 標題: [翻譯] 海外論壇：成步堂和御劍配對是怎麼回事？
: 時間: 前年 夏
:
: 【原PO】
: 成步堂和御劍配對是怎麼回事？
: 我知道他們是從小一起長大的朋友啦。但為什麼這麼多粉絲一直說
: 「別想毀了我對成步堂和御劍配對的夢想」之類的話？
: 我從來沒覺得成步堂是同性戀，御劍或許吧。但我從來沒這樣想過他們。
: 我一直覺得成步堂比較喜歡美柳千奈美，他的老師？
: 這不就只是童年玩伴變成麻吉嗎？
: 身為一個雙性戀，我就是不太懂為什麼大家要硬湊他們倆。
:
: 【回覆一】
: 我也從來沒看出來，但我能理解為什麼有人會這麼想。
: 他們同庭對峙的次數，只有法官比他們多；他們的歷史可以追溯到童年，
: 其中一個救了另一個的命；他們在法庭內外互相幫助。
: 雖然我沒從他們身上感受到任何基情，
: 但如果證實他們相愛，對我來說也不會覺得奇怪。
:

: 他很明顯對女人不感興趣，儘管有很多人向他示好；
: 他生命中最信任的人（不包括家人）是一個男人；
: 他和那個人說話的語言，如果脫離上下文，可能會被理解為浪漫的。
: 成步堂的情況比較棘手。但讓我開始思考「是不是真的有什麼」的，是他當年向人解釋
: 為什麼成為辯護律師：他渴望再次見到這個人，為此改變了整個職業生涯。
: 這有點超出好朋友的行為，因為這是一個非常極端的決定，而且他已經好幾年沒和這個人聯絡。

: 他也說過像「我怎麼能拒絕你」這樣的話，脫離上下文，聽起來有點暗示性。
: 不過，這只是你是否把這些東西解釋為浪漫的還是柏拉圖式的而已。

我今天重讀的感想：

  body:`活動後的剪輯成果，先整理八款：

  body:`1.媒體來源：週刊法律人

Q：官宣滿一年，生活上有什麼不同？

  body:`1.媒體來源：法界日報

4.完整新聞內文：

本報於兩位官宣滿一週年之際，專訪成步堂龍一律師。節錄如下：

Q：官宣一年了，生活上有什麼不同？
成步堂：「律師還是律師，檢察官還是檢察官。開庭的時候我還是會喊異議，他還是會被我嚇到。」

Q：去年的官宣日是 5/17，也就是國際不再恐同日。這個日期有特別的意義嗎？
成步堂：（停頓約三秒）
成步堂：「……啊。」
成步堂：「……有，當然有。」

Q：請問是什麼樣的考量？
成步堂：「四個機關聲明的發布時程，事先都是協調過的，不是隨便挑的。在這個前提下，我們選擇這一天，是經過慎重考量的。法律面前，每個人都應該被平等對待，這個訊息，我們希望盡可能清楚地傳達出去。」

Q：所以日期是兩位一起決定的？
成步堂：「是雙方充分溝通後的結果。」

Q：您剛才停頓了一下，是……
成步堂：「那是在整理措辭。」

（本報註：成步堂律師說完這句話後，拿起桌上的水喝了一口。）

  title:'[整理] 把這兩個人的標籤排成年表 才發現他們是不是太誇張了 (官宣後)', au:'doujin_veteran', nick:'老同人作者', date:'05/19', t:[20,15],
  body:`官宣之後，我把同人圈最常用的標籤拿出來，排成一份年表，再一個一個用公開資料去對。

【童年】
・兒時玩伴：小學同班。
・因故分開：家人出事，其中一人離開，兩人斷了聯絡。
・（從這時候起，成步堂開始寄信，一寄十五年。）

【2016】
・天降竹馬：對御劍檢察官來說，成步堂是「天降」的。
　他不是巧遇，是特地找上門：為了御劍轉系、考律師，然後站到法庭對面。
・勁敵：同庭對峙的次數，只有法官比他們多。

【2016–2017】
・海外歸國：DL-6 事件真相揭曉後，御劍檢察官對「檢察官之道」迷茫，出國。
　臨走留下一張字條：「檢事御劍怜侍選擇死亡」。
・反目成仇：成步堂誤會他是膽小鬼，留張字條就逃跑。（後來證明是誤會）
・死而復生：2017 年，字條上寫「選擇死亡」的人，回來了。
・破鏡重圓：誤會解開之後。

【2017 年之後】
・互相救贖：各種案件裡，兩個人輪流救過對方。
・摯友：官方說法「相識多年，彼此尊重」。

【貫穿全程】
・人生目標：成步堂：「我當律師是為了他。」十三年講了 21 次。
・寄信：十五年，413 封。

另一個「死而復生」：成步堂律師失格七年，洗刷冤屈，重新考上律師。
所以這個標籤，兩個人都用過一次。

整理完只有一個感想：

{
  title:'[閒聊] 板上的老人們（元老回顧）：從六個人守著板 到現在', au:'sawako_cutlet', nick:'街區日常觀察者', date:'05/20', t:[21,0],
  body:`官宣滿一週年，板上的人數是當年的好幾倍。
我想趁這個日子，把我們這群老人的歷史留一份記錄。

2016 年我十五歲，那年夏天，一個下雨的下午，我在店門口看見對面事務所門口有兩個人，共撐一把傘，在雨裡吵架。
一個是成步堂律師。另一個，是一個穿深紅色西裝的人。
我那時候還不知道他是誰。

2017 年，那個穿深紅色西裝的人第一次走進我們店。
他點了兩個海苔粉炸肉餅和一杯可樂。
那時候店快要關門了，我鼓起勇氣說：「如果您不介意的話，我請您吃一個炸肉餅。」
他愣了一下，然後露出一個很不一樣的笑容。
我就是那一刻開始當同人女的。

2019 年成步堂律師失格之後，板上一點一點空了。
有人說「我現在嗑別的 CP 了」，有人說「我後來嗑的那個死了一個」，有人只是不再上線。
最冷清的那幾年，我們剩下六個人，每週一貼，只為了讓這個板還活著。
我們沒有打算等到什麼。我們只是不想把它關掉。

2026 年成步堂律師重新取回律師證的那天，我們六個人各自在不同的地方，在同一分鐘打開了論壇。
然後是官宣。然後是這一年。

我們這群老人，沒有誰是更厲害的。
只是在最安靜的時候，我們還在。

今天這串，想請老人們各自說一句，也歡迎新人留言。`,

  body:`各位好，我是新帳號，第一次發文。
我男友是這個板的潛水老鳥，剛才他逼我來發，說「這種事不發沒人信」。

事情是這樣的：
今天傍晚，我跟我男友（我們都二十一歲，高中就在一起了）在巷子裡親了一下。
不是什麼過分的親，就是小情侶那種，但有點久。

然後我聽到旁邊有人發出一個「呃」的聲音。
我轉頭，看到一個穿西裝的男人，退了一步，右手還舉到胸前，一副被嚇到的樣子。

我當下火很大。這種反應我不是第一次遇到。
我就說：「有什麼問題嗎？沒看過兩個男人接吻嗎？覺得噁心就轉頭走啊。」

他整個人僵住，然後連忙說：「不、不是，我只是被嚇到了，對不起。」
我男友在旁邊拉我，我還在氣，繼續說：「那你剛才那是什麼反應？」

他沉默了一下，然後說：
「你說得對。我不應該有那種反應。對不起。是我失禮了。你們沒有做錯任何事。」

他講完這句，我才看清楚他的臉。

靠北。
是御劍局長。

我整個人當場變成石像。
我男友比我反應快，他小聲說：「欸欸欸，這是……局長？」

局長似乎也發現我們認出他了。他沒有躲，也沒有裝沒事。
他就站在那邊，很認真地跟我們說：「剛才我的反應，不是因為你們。是我自己的問題。」

然後他深深地鞠了一個躬。

我當場想鑽進地洞。
我兇了御劍局長。他還跟我道歉。

結果後來聊了幾句，我才知道：
他說他只是「不習慣」。
然後他立刻又說：「不，這不是藉口。」

我男友鼓起勇氣說：
「局長，你們這一代人，是讓我們可以這樣的人。謝謝你們。」

局長愣了一下，我看到他耳根紅了。
他又鞠了一個躬，很小聲地說：「……謝謝。」

我男友補了一句：「你下次也可以試試看跟你老公牽手。」
局長說：「……我會試著。」

然後他就走了。
走得很快，背影很直。

我到現在腦袋還是亂的。
我只想問大家：這是怎麼回事？？？

P.S. 請不要問地點，也請不要去巷子堵人。他只是下班路過而已。`,

  body:`先說，我是 gay，這串純屬個人經驗。

我認識過十幾個同志朋友，雷達是這樣練出來的。
有些人你一看就知道，熟了之後幾乎都猜得八九不離十。

【御劍局長】
雷達很早就響了，而且是那種「想太多的人」的響法。
想太多，加上職業壓力疊上去，因為各種原因需要表現得很強勢，卻又不斷在內耗。
強勢是工作需要，不是天性。這種人在感情裡，其實很難當「帶頭」的那一方。

【成步堂律師】
這個我必須認錯。

{
  title:'[閒聊] 超市遇到御劍局長 阿伯問他：律師先生沒來喔？', au:'veg_passerby', nick:'路過買菜的', date:'07/23', t:[19,40],
  body:`剛剛下班順路去超市，在調味料那一排看到一個很眼熟的背影。
西裝、手上拿著購物籃，籃子裡很雜：一把青蔥、一盒豆腐、一包海苔，還有一包看起來跟其他東西完全不搭的洋芋片。
我走近一點，確定了，是御劍局長。

他在比兩瓶醬油。
他先看了一下手機，然後拿起一瓶，轉過去看背面的成分表，再看手機，再看標籤。這樣來回大概三、四分鐘。

這時候補貨的店員阿伯走過來，很自然地說：「局長，找醬油喔？律師先生今天沒一起來啊？」
局長：「他今天有庭，我自己來。」
阿伯：「找哪一種？」
局長把手機拿給他看了一下。
阿伯看完，指著上面一排：「薄鹽的在這邊啦，你手上那兩瓶是減糖的。」
局長：「……」

他把兩瓶都放回去，從阿伯指的那一排拿了最貴的那瓶。
沒有看價錢。
阿伯點點頭：「這罐可以。」
局長也點點頭。

結帳的時候他自己拿袋子。
我只是覺得，原來局長也是會自己來超市採購的人，而且這間超市的人都認識他。`,

{
  title:'[盤點] 王牌律師告你家：惹到成步堂律師的那些人 附結果', au:'case_digger', nick:'案件挖掘者', date:'08/18', t:[23,10],
  body:`這陣子超市、市場那幾篇看下來，大家都覺得成步堂律師是個脾氣很好的人。
這我同意。但我把公開資料翻了一遍，發現有幾種人，他是一次都沒有放過。

【二】擅闖法庭的記者（2028/12）
地震後三分鐘內擅自進入法庭拍攝。

【三】「炒作」粉專（2029/05，官宣後第三天）
粉專發文寫「公關操作」「為了流量」。
成步堂律師事務所 24 小時內寄出存證信函，列了三條事實錯誤，附上判決書影本。

【四】AI 合成「獨家對話」影片（2029/09）

我看完之後的結論：
他不吵架，他只寄信。格式漂亮、條列清楚、期限明確。

{
  title:'[心得] 模擬法庭決賽 頒獎結束後 兩位評審在走廊上為了「離開現場」辯了三十八分鐘 我們全員躲在轉角圍觀', au:'mock_court_kid', nick:'大二法學院', date:'08/24', t:[22,30],
  body:`今天是全國大專院校模擬法庭決賽，我們學校打進去了。
評審有兩位：檢察局的御劍局長，還有成步堂律師。
開賽之前大家都在緊張，我們教授還說：「評審是這兩位，你們放輕鬆，反正怎麼準備都沒用。」

比賽本身很順，兩隊都打得很好。
講評也很正常，兩位都準時、簡短、重點清楚，沒有任何一個人拖時間。

只有一個小地方。
題目的案情裡有一句話：「被告離開現場後，聽到一聲巨響。」
成步堂律師在講評時只說了一句：「這裡的『離開現場』，題目有點歧義，這個我晚點再跟御劍局長確認。」
御劍局長點了一下頭：「好。」
然後他們就繼續講下一題了。

頒獎結束，我跟幾個同學其實是打算去找評審簽名、合照的。
想說評審離場一定會經過走廊，總有個空檔。
我們就在走廊轉角那邊等。

兩位評審出來了。
他們沒有往出口走，就站在走廊中間。

成步堂：「所以我說，『現場』要看被告當下的位置，離開房間就算。」
御劍：「以一般用語，『現場』指的是整棟建築。」
成步堂：「但案情裡沒有交代建築的格局。」
御劍：「題目的前提是常識判斷。」
成步堂：「常識會因人而異。」
御劍：「那就是你的解釋。」
成步堂：「那是題目的問題。」

我們躲在轉角、飲水機後面、樓梯間門口，一群人探出半個頭。
本來以為會有什麼私人互動，或至少有個空檔能衝出去要簽名。
結果沒有。全程辯論。
他們兩個，從頭到尾沒有提高音量，也沒有一個人看向旁邊，根本沒發現走廊上躲了一整排人。

最後是會場的清潔阿姨拿著拖把過來，小聲說：「那個……兩位，要關門了。」
兩位同時轉頭，同時說：「……抱歉。」
然後他們就一起往出口走了，邊走邊繼續。

我後來看了一下時間，從頒獎結束算起，他們辯了 38 分鐘。
我手上的簽名板，一個字都沒簽到。
出題的助教站在後台，說他今晚要重寫題目。`,

{
  title:'[閒聊] 颱風夜上班的警衛 看到有人蹲排水孔 結果是成步堂律師', au:'guard_uncle', nick:'颱風天警衛', date:'09/14', t:[1,20],
  body:`颱風夜，停班停課，全市都在家，只有我們這種大樓警衛要在崗位上。
我坐在管理室裡，看著外面的雨一直橫著打，旗桿都快被吹斷了。

大概晚上十一點，我看到馬路對面的排水孔旁邊，蹲著一個穿黃色雨衣的人。
手上拿著手電筒，另一隻手拿著一把已經被吹成花的傘。
他在那裡蹲了二十分鐘，一直照排水孔，還會用手比畫水流的方向。

我一開始以為是市政府的人在搶修。
然後我想說不對，市政府的人通常會有反光背心跟安全帽，這個人沒有。

我實在放心不下，就拿了毛巾跟一杯熱茶，撐傘出去。
走近一看，他轉頭的時候，帽子被風吹掉了。
是成步堂律師。

我：「律師！？這種天氣你在做什麼！？」
成步堂：「啊，不好意思，我在確認一下這邊的水流方向。」
我：「為什麼！？」
成步堂：「有個案件需要知道當天現場的雨量條件。」
我：「你不能等天氣好了再來嗎！？」
成步堂：「但等天氣好了，水就不是這樣流了。」
我：「……」

他拿了毛巾，喝了兩口熱茶，連說了三次「謝謝」。
然後他拿著那把被吹成花的傘，又走回排水孔旁邊，繼續蹲下去。

我回到管理室，過了十分鐘，他又走過來敲窗：「不好意思，請問你們大樓的監視器，有拍到這個角度嗎？」
我：「……有。」
他：「可以讓我看一下嗎？」
我：「……你進來吧。」

今天我才知道，颱風天還在外面找線索的人，不只是電視裡會演的。`,

  body:`今天第一次排到國際司法研討會的同步口譯，被排到的 panel 是「公訴與辯護的對抗」，講者是御劍局長跟成步堂律師。
出發前，前輩只說了一句：「這場你不用緊張，兩位的英文都很好，他們講什麼你就翻什麼。」
我想說也對，這麼資深的人，英文應該很標準。

整場 panel 是用英文進行的。
大概到第二十分鐘，兩位開始針對一個案例討論「證據的合理推論」。

御劍局長：「Your argument only suggests that the defendant cleaned himself up after the fact.」
成步堂律師：「I-I know that...」
御劍局長：「I know that bluffing your way through things is your calling card... but your credibility phoned just now and told me to tell you to put a sock in it.」
成步堂律師：「Y-Yes, Daddy...」

我耳機裡聽到這句，直接停住三秒。
我們口譯是要同步翻的，我人愣住了，嘴巴張開，什麼都吐不出來。
隔壁 booth 的前輩，一個手勢，示意我「繼續」。
我只好硬著頭皮翻出：「請讓我再試一次。」
然後我抬頭看會場。

會場的人，沒有一個人有反應。
國際法官在記筆記，韓國的檢察官在喝水，新加坡的律師在看手機。
主持人是一位資深法官，聽完只說：「Thank you, gentlemen. Next question.」
全場沒有一個人笑。

下台之後我去問前輩。
前輩：「哦，這兩位每次都這樣。」
我：「每次！？」
前輩：「去年在新加坡也是，前年在首爾也是。他們兩個一用英文辯論，就會變成這個調調，大家早就習慣了。」

我現在還在想，到底是誰在這個行業裡建立了這個共識。`,

{
  title:'[心得] 檢察局開放參觀日 局長蹲下來的那幾分鐘', au:'law_freshman', nick:'法律系大一', date:'10/18', t:[21,20],
  body:`週六去了檢察局的開放參觀日，教授逼我去的，說要交一千字心得。

我大一，成績普通到我開始懷疑自己選錯系，所以去之前的心態是：走一圈、拍幾張照、領紀念品，心得隨便寫。報名是秒殺，我輸給一個小學生的媽媽，最後是教授手上有保留名額才進去。

導覽是局長親自帶。一組二十個人，一半是學生，一半是帶小孩的家長。我在這個板上潛水夠久，看過太多關於他的貼文，所以一站到他旁邊，腦袋就自動開始對照，對照他跟那些故事裡的那個人是不是同一個。

先說大人的部分，因為我本來以為整場都會是這樣。

他講話很慢，每一站都先問大家看得到嗎。有位爸爸一路拍照，拍到辦公室裡面去，我心想完蛋，他要被念了。結果局長走過去，很客氣地說辦公區域不能拍，大廳走廊可以，請便。爸爸反而放鬆了。走到辦公樓層，有個年輕檢察官看到他，起身要行禮，他搖手叫他繼續，那個人耳朵紅了一路。

問答的時候有位家長問起訴的標準是什麼。他整個人轉過去，一口氣講完：依偵查所得的證據，認為有足夠的確信被告有罪，才會提起公訴；證據不足，或證據顯示不是被告所為，會不起訴；另外，檢察官有義務一併注意對被告有利的證據。完整、準確，沒有一個多餘的字。家長說謝謝，他說不客氣。我低頭抄筆記，心想，嗯，就是這個樣子。

結果走到模擬法庭，一群小朋友圍上來，場面就變了。

有個小朋友抬頭就問：「檢察官是壞人嗎？」旁邊的家長整個人僵住，我也僵住。他蹲了下來，蹲到跟小朋友視線一樣高，說他的工作不是找人定罪，是找出真相，有時候真相會讓被告沒事。小朋友又問：「那你會輸嗎？」他想了一下說，會，但輸的時候我會知道為什麼。

我站在後面，那句話莫名其妙戳到我，因為我連我輸在哪裡都不知道。

然後另一個小朋友在旁邊小聲說了一句「看起來好無聊喔」。家長又要道歉，他抬手說沒關係，走過去蹲在那個小朋友旁邊，問：「如果班上有同學的午餐費不見了，老師要怎麼辦？」

小朋友說，問大家是誰拿的。他說對，老師會聽大家怎麼說，檢察官的工作也像這樣，要聽大家說，弄清楚發生了什麼事，找到錢為什麼不見。小朋友說，那找到拿錢的人就好了。他說，可是如果老師沒有仔細查，就可能找錯人。

然後他停了一下。

很短，大概一秒。我以為是麥克風出問題，因為他講話一直很穩，所以那一下特別明顯。

他才問：「如果被找出來的那個人，是你的好朋友呢？」

小朋友馬上大聲說：「他不會做這種事！」

他點點頭，說，對，會有人像你一樣相信他不會做這種事，那個人就是律師。老師要認真查，相信他的人也要認真幫他說話，兩邊都很重要。小朋友問，那老師一個人查得完嗎？他說查不完，所以需要別人幫忙：去看現場的叔叔阿姨、整理東西的人，還有看到的人。

「我們要知道的，不只是誰拿了錢，是錢為什麼不見。有時候是掉在椅子底下，有時候是被放錯書包。找到原因，才不會冤枉人。」

小朋友眼睛睜得很大：「那這樣就不無聊了。」
他笑了一下：「對，有時候還很緊張。」

我旁邊的同學小聲說，他對小朋友跟對大人講話，完全是兩個人。我說對，但我腦中還在重播剛才那一下停頓。

最後問答的時候，我其實有一個問題。我想問，成績不好，真的可以念這個嗎？我手舉到一半又放下來，因為在我開口之前，後面有一位同學先說了。同一句話，一個字都不差。他說的聲音很小，我還以為是我自己的聲音。

局長沒有馬上回答，他看著那位同學，認真想了一下，說，檢察官的資格跟成績不是同一件事，你願意為了一件事查到最後，這就夠了。

那位同學低下頭擦眼睛，我也擦了一下。我說我是花粉過敏。

結束之後他站在出口，對大家說了一次「路上小心」，就一次。一個小朋友走出去的時候大聲喊「叔叔掰掰！」，他才又回了一句「再見」，還揮了一下手。我經過他旁邊的時候愣了一下，才說出一句「謝謝局長」，他點了一下頭。

走出去我才發現，那是我整個下午第一次開口說話。

我坐在回程的車上，想著心得要寫一千字，可是這一天最重要的東西，好像寫不進去。`,

  title:'[心得] 民事案件請不要去找成步堂律師 我就是追星心態的受害者', au:'inherit_asker', nick:'遺產諮詢者', date:'10/22', t:[23,5],
  body:`先說結論：民事案件，請不要去找成步堂律師。

不要問我為什麼，我慢慢講，我只是想把我自己的丟臉經驗，換成一個對大家有用的警告。

事情是這樣的。
我爸去年走了，留下一棟老房子，還有三個互相不太講話的兄弟姊妹（包括我）。遺產談不攏，大哥說爸爸生前口頭答應過房子給他，二姐說她照顧爸爸最久所以應該多分，我只想要有人幫我把這件事做個了結。
所以我打開手機，搜尋「律師 遺產」。

然後我必須承認一件事：搜尋結果跳出「成步堂法律事務所」的時候，我的手指自己點進去了。
（對，我就是那種人。我在這個板上潛水很多年，我當時的想法是：律師不都嘛一樣，那當然找我想找的，而且這是我人生中最有名目去見他的機會。事務所只有成步堂律師，還有後輩的王泥喜律師跟心音律師，沒了，就這麼小。）

預約很順利。進門的時候他親自出來，穿著那件藍色西裝，跟我握手，請我坐。我腦袋當機三秒，坐下之後把家裡的事從頭講了一遍。他一直點頭，筆記寫得很認真，講到二姐的時候還會皺眉。我當時心想，太好了，他懂我。

然後我講到「房子是爸爸名下，但土地跟叔叔共有」，他的筆停了。
我繼續講到「大哥說有一張爸爸簽名的字條」，他額頭開始冒汗。
講到「爸爸生前借過二姐一筆錢」的時候，他把手帕拿出來了。

我第一次那麼近看一個人，在不到十分鐘的時間裡，汗從髮際線流到下巴。他擦了兩次，第二次已經不太掩飾了。

「……不好意思，」他終於開口，「我先說，這個……民事，我真的不是很擅長。」
我說：「可是你不是——」
他說：「我是刑事辯護的。你的案子是遺產分割、特留分、借款認定，這幾個領域，我如果接了，你會吃虧。」
他講得很認真，認真到我反而說不出話。

然後他拿起手機，撥了一個號碼：「喂，王泥喜嗎？你現在在哪……可以回來一下嗎……嗯，現在。」
事務所就這麼大，我聽得到隔壁桌心音律師敲鍵盤的聲音，她停了一下。
成步堂掛了電話，轉頭看向她，眼神裡明明白白寫著「救我」。
心音律師頭都沒抬，雙手在胸前比了一個大大的叉。
成步堂：「……」
我當時才知道，原來真的有人可以用兩隻手臂的叉叉，拒絕自己的前輩。

大概十分鐘後，王泥喜律師喘著氣推門進來，手上還拿著剛從法院帶回來的檔案夾。成步堂站起來，很鄭重地對他說：「這位的案子，拜託你了。」
然後他對我鞠躬。是真的鞠躬，不是點頭。
他說：「抱歉讓你白跑一趟，但我覺得這樣對你最好。」

之後的事很簡單。王泥喜律師不到三十分鐘，把我整個案子拆成三塊，告訴我每一塊要準備什麼證據、期限是什麼，第一步先寄一封什麼樣的信。清楚到我想給自己一巴掌。

我走出事務所才發現，我整個下午都沒有要簽名，也沒有拍照。
一直到現在我才想到，那是我這輩子被拒絕過最有禮貌的一次，也是最有幫助的一次。

所以我的結論是：術業有專攻。民事就找專門做民事的律師。你喜歡誰是你的事，但別把家裡的事拿去當追星的藉口。他會幫你，只是他幫你的方式，可能是把你交給更適合的人。`,

  title:'[目擊] 寒流第一天 車站前 御劍打了一個噴嚏 成步堂宣布證據成立', au:'cold_passerby', nick:'縮著脖子的路人', date:'11/09', t:[8,40],
  body:`今天寒流第一天，我穿了三層，外面還套羽絨，走到車站的時候臉已經沒有知覺了。

我本來只是想看看站前那攤有沒有賣熱豆漿，結果在公車站牌旁邊，看到一個穿得非常認真的人。毛帽、厚外套、長圍巾、手套，整個人像一顆圓滾滾的藍色麻糬。我一眼就認出來是成步堂律師，這個人穿得剛剛好，一點都沒打算跟天氣賭。

然後我才看到他旁邊站的那個人。

深色西裝，外面只加了一件風衣。就一件。扣子扣得整整齊齊，領巾也是一絲不苟。下巴微微抬著，一副「我不冷」的臉。我看了他三秒，牙齒就開始打顫，我是替他打的。

成步堂律師也在看他，但他什麼都沒說。他只是站在旁邊，雙手插在口袋裡，嘴角有一點點往上，像是在等一件很確定會發生的事。我當時還以為是我想太多。

然後那個人打了一個噴嚏。

很小的一聲，整個被他用手背壓住了，大概只有我這種站得夠近、而且豆漿買不到所以閒著沒事的人才會聽到。他放下手，面不改色，繼續看著公車來的方向。

成步堂律師慢慢轉過頭。
我看到他笑了。不是平常那種笑，是那種「終於等到了」的笑，嘴角整個咧開。

「噴嚏。」他說。
「……那是灰塵。」
「噴嚏是證據。」
「成步堂，你不要在街上——」
「證據已經提出。」

他把脖子上的長圍巾解下來，從局長的下巴開始繞，一圈、兩圈、三圈，繞到只剩眼睛跟鼻子露出來。局長整個人往後縮：「領巾！領巾會亂掉！」
「領巾本來就在裡面，你看不到。」
「那就是亂掉了！」
「打噴嚏的人沒有資格說不冷。」
「我不冷，我有風衣！」
「風衣擋不了風。」

我真心覺得我在看一場庭審。

成步堂又從口袋裡掏出一雙手套，我從側面瞄到，是那種文具店特價區才會有的花色，米色底，上面一整排小熊在打雪仗。他拉過局長的手，一隻一隻套上去，動作很快，我懷疑他練習過。
局長低頭看了兩秒自己手上的小熊。

  body:`※ 引述《budget_passerby》之銘言：

{
  title:'[心得] 被成步堂律師救過之後 我終於有辦法好好講他了', au:'former_client', nick:'被救過的人', date:'11/28', t:[23,12],
  body:`這幾天看了庭期整理串，看到他上週又是五天全滿，我坐在椅子上看著那張表，突然發現我已經可以很平靜地看了，所以才開這篇。

先說，案子的細節我不講。我只說我是好幾年前的當事人，他是我的辯護律師，結果是無罪。我出來之後第一個去的地方不是我家，是事務所。事務所在二樓，我爬上那段樓梯，爬到一半就聞到對面炸肉餅店飄過來的油香，那是我被關起來之後第一次覺得肚子餓。我在門口站了很久，沒有敲門，只是對著那扇門鞠了一個躬，就下樓了。

我想講的是他在法庭上的樣子。你們平常看到的他，是笑笑的、講話軟軟的那一種吧，有時候連名片都拿反。我第一次見他的時候也是這樣想的：這個人，真的靠得住嗎。

那時候我的世界是整片烏雲，所有人都已經認定是我了，連我自己的家人講話都小心翼翼的，我也不知道還能相信誰。

然後開庭了。他站起來的那一瞬間，我完全不認得他。聲音是穩的，手撐在桌上，每一句話都是往前推的。檢察官問一句，他答三句，答完還會反問回去。我坐在被告席，眼睛一直盯著他，我看到他的背後一直在冒汗，可是他的聲音一點都沒有抖。有一個段落他明顯是在虛張聲勢，我看得出來，因為我是當事人，我盯了他一整個上午。可是他一邊唬一邊在找，找到的那一刻，他整個人是亮起來的，像是有人把雲撥開，光就那樣照到我身上。

我是結案後才知道，他是前一天晚上才拿到完整的資料。

所以，對，我後來有一陣子是真的暈了的。我不是以為他跟我之間有什麼，這個我很清楚，他救我只是因為他就是會救人。可是人在最暗的時候，有人挺身站出來，把陽光帶回來給你，你要我怎麼可能不心動。我那陣子滿腦子都是他站起來的樣子，連做的夢都是那個畫面。

我一直想著要找一天，把話好好講給他聽，結果每次都只敢在門口鞠躬。然後就是官宣，去年五月。我在便利商店買關東煮，手機跳出新聞，我把夾起來的白蘿蔔放回去了。我不是難過他有人，是難過我自己那一點點小小的、從來沒有講出口的心思，就這樣被很大聲地收掉了。

去年一整年，我都在想，為什麼我當時沒有把握機會，哪怕只是把話講出口也好。講了也許什麼都不會變，但至少我會知道。我那時候真的有一點不甘心。

今年慢慢好了。不是有人勸我，也不是我多勇敢，就是有一天我看著那張庭期表，想到他前一天晚上才拿到資料，隔天還是笑著站起來，我就覺得，我的心動從頭到尾都不需要有結果。他是那個把光帶回來的人，這件事不會因為他結婚就變少。

我現在是這個板的路人，偶爾會經過，看看庭期整理串，確認他這週有沒有太累。祝他們幸福。真的。`,

  body:`先說明，我是男同，這篇純粹是以一個同圈人的角度閒聊，沒有要冒犯誰。

{
  title:'[心得] 追了十年的人今天來找我五次 我下班整個人是麻的', au:'security_fan', nick:'想混口飯吃的保全', date:'12/02', t:[19,30],
  body:`先說，我是成步堂律師的粉，粉了十年那種。

我工作的那棟大樓，前陣子出了命案，案子你們可能有看到新聞。被告後來委託的律師，是成步堂律師。我一聽到的時候，說實話，是興奮的，我心想欸，他要來我的地盤了。

然後他就真的來了。第一次是早上，他穿著那套很熟悉的西裝，我人還站在警戒線外，整個人都站直了。他很正式地對我說他是辯護人，需要進入現場確認，我當然知道他是誰，可是我也知道，我手上沒有許可，這條線我不能放。我把這件事跟他說了，他沒有笑，沒有任何一點平常我在採訪裡看到的那種笑咪咪，他很嚴肅地聽完，然後托著下巴，低頭想了一下，像是在腦子裡翻什麼東西。接著他說「我知道了」，轉身走了。

十五分鐘後他又來了。這次拿了一疊文件。我看了，不是許可，我又說了一次。他抓了一下後腦勺，額頭上有一點汗，說「那我再去問問」，走了。

第三次，我轉身去接一通電話，回頭的時候，他已經站在警戒線的邊邊，一隻腳抬到一半。我跟他對上眼。他整個人停在那個姿勢，然後很慢地把腳放下來，那個表情，是尷尬、委屈，加一點點不甘心，像一個被抓到偷吃的小孩。

第四次，我真的沒看到。我是聽到後面有動靜，跑過去的時候，他已經在線裡面了，離現場的門只剩幾步。我當下完全沒有想，就從後面抱住他的腰，把人整個架起來，往外拖。他說「我只是想看一眼！我保證什麼都不動！」我說「律師，對不起，你不能進去。」我一邊說，一邊在心裡想：我現在，是不是，抱到成步堂律師了。

{
  title:'[心得] 我還活著 順便說一下 我還有在粉 只是心靈受到了大大的創傷', au:'security_fan', nick:'想混口飯吃的保全', date:'12/09', t:[22,15],
  body:`先聲明：我還有在粉。
真的。粉了十年的人，不會因為被他在證人席上釘一次就脫粉。
只是我現在心靈受到了大大的創傷，需要一點時間。

案子的部分不能講太多，我只講我自己的事。

我以前一直以為，成步堂律師在法庭上的樣子我很熟，新聞、庭審紀錄、旁聽的人轉述，我都看過。
結果真的站上證人席才知道，看跟被他問，是兩回事。

他不是凶，他甚至一直很有禮貌，就是那個壓迫感，你根本沒辦法形容。
你講的每一個字他都在聽，你停頓一秒他也在聽，你稍微換個說法，他就把你上一句原話拿出來放在你面前，問你這兩句是不是同一個意思。
我那天從頭到尾都在想：我到底是來作證，還是來被審。

然後我犯了一個錯。

命案那天，我在崗位上，大部分時間都在。
但有一段時間，我去了一趟便利商店。
十分鐘。真的只有十分鐘，而且就剛好是事件發生的前後。我心想，這種事情，應該沒什麼大不了吧，回來之後跟大家說我剛剛在巡邏就好了。

結果我話一說出口，他就說「等一下！」

接著就是異議，加證物，加異議，加證物。
我整個人被釘在證人席上，連一個縫都沒有。

他怎麼知道我去了哪裡？羊羹。
那天我買的是限定羊羹，中午開賣，下午就賣完，到現在也沒有任何一間店補貨。
而命案過了一兩天，他來看現場，在警戒線外面想闖進去的時候，眼睛掃到我桌上那個包裝盒，隨口問我那是什麼。
我還很開心地多聊了兩句，說「我只買到了一條，下班的時候就已經缺貨了」。

現場錄影有拍到我在崗上的時間，只有事件前後那十分鐘是空的。
一條中午才開賣、下午就沒貨的羊羹，我是什麼時候買到的？
他沒有直接問我。他只是把這幾個東西一個一個擺出來，擺到最後，我自己把話吞回去了。

說是這樣說，他問的重點，其實根本不是羊羹。
他在意的是，我在某個時間看到的東西，究竟是不是真的在我說的那個時間看到的。羊羹只是把我從那個時間點拉出來而已。

我後來在證人席上，把「我去巡邏」這個說法，收回來了。

走出法庭的時候，我整個人在發抖。
但說真的，我心裡想的不是生氣，而是：原來這就是被他當成對手的感覺。
原來這就是我追了十年的人。

這輩子，我再也不要當第二次證人了。
但他如果之後再來，我還是會去看。`,

  title:'[心得] 早鳥組收到花絮小冊了 我花了四十分鐘看一頁', au:'no_food_fan', nick:'缺糧中的人', date:'01/09', t:[21,10],
  body:`先聲明，我就是上個月底在這個版哀嚎「官宣一年半沒有糧」的那個人。

今天早上簽收，我忍了一整天沒拆。因為我知道拆了就不會再有「第一次」，我想把這件事留到晚上，洗完澡、泡了茶、手機關靜音，才把它拿出來。

薄薄的一本，比想像中小很多。我當下的想法是：這麼薄，是要我怎麼活。結果翻開第一頁我就知道我錯了，不是薄的問題，是每一頁的密度。

第一組是吧台，就只是兩個人穿著日常的衣服，隨便找了張椅子坐下來吃早餐。第一張甚至不是什麼好看的畫面，一個人在拆三明治的包裝紙，另一位低頭看著他的手，兩個人都還沒有要看鏡頭的意思。那一看就知道不是在拍照的狀態，只是生活裡的某一天，在早餐時間找到了張椅子。我盯著那一張看了很久，因為我突然意識到，我追了這麼多年，從來沒有看過這麼多張，這兩個人在「沒有要被看」的時候是什麼樣子。

然後才是有故事的那幾張。吃三明治的那一位，生菜掉了下來，整個人僵住，那不是單純被嚇到，是「被人看到不完美」的慌，一個大概連吃東西都不想讓東西掉下來的人，居然在鏡頭前掉了生菜。再下一張，另一位撐著臉看他，連頭髮都拿來玩，眼睛完全沒有看鏡頭，笑得很放鬆。再翻過去，吃三明治的那一位耳朵紅了，一把抓住那隻手，眼睛往鏡頭的方向瞥了一下。就那一下。他知道有人在拍，另一位完全不知道。我就是從這裡開始整個人不太對勁的，因為這是我一年半以來，第一次親眼看到兩個人「對鏡頭的意識」差這麼多，而這個差距，居然是用一個耳朵紅的表情告訴我的。

然後我翻到了下一頁，那是一組兩人剛從車上下來的照片。第一張，車門才剛打開，其中一位已經在往前走了；第二張，走在前面的那位忽然停了一下，回頭，整個人愣住，像是被誰叫了名字；第三張，後面那位手上拿著一件外套，嘴巴張開，表情是那種「真拿你沒辦法」的無奈，又好像一點也不覺得麻煩。我把第三張放大，盯著他的嘴型想了十分鐘，我現在的結論是他說的是「外套」，但也有可能是名字，我不確定，我也不打算確定。我只是覺得，一個人會用那個表情叫另一個人，大概已經叫過很多次了。

再往後翻，是天使跟惡魔，這一組我翻了三遍才翻懂，因為它根本不是「兩個人拍了一組很好笑的照片」，是整個打鬧的過程都被拍下來了。第一張，一個人拿著光圈往前湊，另一位後退，臉很臭；第二張，手腕被抓住了，兩個人擠在一起，我已經看不出來誰在拉誰；第三張，光圈終於戴上去了，是歪的，衣服皺到不行，耳朵紅得像要燒起來，臉臭得很誠實。旁邊那位戴著惡魔角比 ya，笑得太開心了，一看就是始作俑者。我看到這裡的時候在床上笑了三分鐘，然後才發現我笑到眼角有點濕，不知道為什麼。

接著是睡著的那一頁。我在這頁停了很久，十五分鐘，沒有任何想法，我只是看著。一個人睡著了，另一位對著鏡頭擺了一個「噓」，另一隻手在整理睡亂的頭髮。那隻手沒有在演。而且那個「噓」不是對我們說的，是對鏡頭後面的人，所以現場至少有三個人，我對 N.M. 又多了一點敬意。

最後是純白法庭。我把手機相簿翻出去年在展場拍的純白法庭，對了一下，角度完全一樣，就是主冊會用的那個位置。一個人側著頭，停在還沒碰到的那一秒。然後冊子就沒有下一頁了。我拿著它坐在床上，才發現我整個晚上都在屏息。

更新一下我上個月的糧食清單：這半年他們自己放出來的同框照，不只 0 張了。主冊還沒到，我不知道它收的是這一秒的前，還是後。我今天不會睡。`,

  title:'Re: [心得] 早鳥組收到花絮小冊了 我花了四十分鐘看一頁', au:'noon_passerby', nick:'路過的路人', date:'01/09', t:[23,15],
  body:`看完樓上這篇開箱，我睡不著，想把前年的事說出來，給新入坑的人當個警告。

我前年偷拍過他們一張。

那是官宣前一年。那時候板上還在吵「他們到底有沒有在一起」，我在一個公開場合遠遠看到兩個人站在一起，不是正式的場合，就是站著說話。我朋友一直不相信，我想著拍一張證明給他看。就一張。我把手機拿出來，按下去，然後以為沒有人發現。

十秒後，成步堂轉過身，走過來。

沒有生氣的表情。比生氣更可怕的是，他沒有笑，一點笑意都沒有，就是冷冷的，很有禮貌地說：「不好意思，可以麻煩你把剛剛那張刪掉嗎。」
我說我刪，我真的馬上刪了。他說謝謝，請讓我看一下。我打開相簿給他看，他確認了，然後說「謝謝配合」，轉身走回去，整個過程不到一分鐘。

我手一直在抖。我連道歉都講得亂七八糟。

後來我有一個月睡不太好。每次看到成步堂的新聞，心跳會漏一拍。
也有人跟我說過，如果是發到公開場合，他是會直接寄信的，那就不是刪掉能解決的了，我沒有試過，也不想試。

今天看到這本小冊子，我才第一次覺得，他們不是不讓人看。
是想自己決定給誰看。

我不是要說教，只是想告訴剛入坑的人：
糧不要自己去搶，他們給的時候會給。
我的手到現在想起來還在抖。`,

{
  title:'[心得] 第一批主冊到了 打算 cos 成步堂的我 軍心渙散', au:'naru_prep', nick:'練了兩個月的成步堂 coser', date:'03/20', t:[22,10],
  body:`先自我介紹，我是這次展場拍照區報名要 cos 成步堂的人。
我一個單身狗，連一起 cos 御劍的搭檔都還沒找到，但我是真的有練。

早鳥的小冊，我拿到的時候以為那是絕殺。
我當時整個人的想法是：這是教科書。
我把吧台那組一張一張記下來，撐著臉看對方吃飯的表情，我在鏡子前面練了二十幾次。我把下車那張拿外套的無奈也練了，嘴型我自己配了一版，還真的被我配到了一個我覺得還算像的。
兩個月，我就靠這本小冊，揣摩他到底是怎麼笑、怎麼無奈、怎麼把心情放在臉上。

然後今天，第一批主冊到了。

我是先翻到純白法庭。
紅藍各站一方，辯論姿態，那組我很有信心，因為我練過一百次。
再往後翻，白西裝雙拍。
一張是穿白西裝的那位，一臉擔憂地看著前面不回頭的人。一張換過來，是前景的人溫柔安心地回頭，後景的人在席上，對著空席擺異議姿勢。
我看著這兩張，突然發現我不知道該怎麼練。

不是姿勢難，姿勢我看一眼就會。
是那個眼神。
我找不到任何可以學的地方。

再往後翻，雪景。
兩個人額頭靠著額頭，戴戒指的那隻手輕輕撫摸對方的臉，兩個人都閉著眼睛，雪落在肩膀上。
我看了很久。然後我把我的筆記本闔上了。

我才想起來我買的是什麼。
我買的是兩個人在一起的照片。
我以為我在研究「怎麼演」，其實我一直在看一個人沒有在演。
他不是在笑給鏡頭看，不是在無奈給誰看，不是在設計表情。
他就只是跟他最深愛的人在一起，然後剛好被相機留下了身影。

我後面還翻了奇幻景的天使惡魔、書房、街角那張行李箱加紅圍巾、年差拍攝，還有那張借位。
每一張我都想繼續寫筆記，每一張我都寫不出來。

3/30 我還是會去，拍照區我也還是報了名。
但我不打算再演了。
我決定站在那裡，當一個很普通、會笑、會緊張的人。
其他的，我學不來，也不想硬學。`,

{
  title:'[心得] 婚攝出身的我 看完主冊先估了一下拍攝天數 結論是這不是兩天拍得完的', au:'wedding_shooter', nick:'拍了八年婚攝的人', date:'03/22', t:[21,0],
  body:`先說我的職業病：我做婚攝八年了，拿到一本寫真集，第一件事不是看好不好看，是先翻到最後一頁，算頁數，然後在心裡估這本要拍幾天。

這本主冊 64 頁，有雙人、也有單人。以特約來說，這個厚度非常有誠意。

我來算一下。

場景：純白法庭、書房、餐廳、奇幻景、街角，加上年差拍攝，一共六組。
服裝：每人五套以上，所以換裝至少十次，婚攝一天最多排三到四套，單單換裝就要三天。
日夜景皆有：夜景最少要兩個晚上。
雪景：純白法庭是戶外景，要碰上下雪，我完全知道這種事不是排得出來的，是等到的。
年差：要上妝成年輕版，光是妝就要兩到三小時，一天最多一組。

以上全部加起來，我的估計是至少五天，保守七天。

但我真正想說的不是天數。

我拍婚攝八年，最難的一件事，是讓新人在鏡頭前放鬆。一般來說，一對新人要拍兩個小時，才會真的把鏡頭忘掉，然後我才能拍到「他看著她」的那一張。
這本書的雙人頁，我翻了十幾頁，沒有一張在看鏡頭。
他們看的都是對方。
這八年我只遇過兩對新人做得到。

但單人頁就誠實多了。
單人頁一翻，我就知道兩位特約裡，誰是真的很想拍。
cos 御劍的那一位，每一張都像在交作業，眼神、手、站姿，全部都認真到近乎苛刻。
另一位就不一樣了。一少了對象，那張臉立刻變成皮笑肉不笑，眼神放空，一看就是滿腦子都在想「這一卡到底什麼時候結束」，完全沒想到會輪到單人照的那種放空笑臉。
這種笑我太熟了，婚攝圈叫它「家屬陪拍笑」，意思是眼睛在說「我現在要是不認真陪，回家是不是就要跪算盤」。

還有一件事我必須承認：這本書從頭到尾，都像是我很想拍、卻一直拍不出來的那種婚攝。
所以我現在很不爽，也很服氣。

我不敢報價。這個套組，我不敢報價。`,

{
  title:'[心得] 玩近景魔術十年的我 看完主冊年差章 花了一個晚上還是拆不出那個「小一圈」怎麼做到的', au:'magic_nerd', nick:'玩了十年近景魔術的人', date:'03/24', t:[23,30],
  body:`先交代一下，我玩近景魔術十年，專門吃的就是「視線管理」這一口：觀眾看哪裡、不看哪裡、覺得東西多大、覺得人多遠，全是可以做的。所以主冊到的時候，我是帶著「我要來挑毛病」的心態翻開年差章的。

結果我現在凌晨還沒睡。

第一張就讓我坐直了。

地上坐兩個人，背對背，沒有靠，中間留了一條縫。後面那位 cos 御劍的，就是普通坐在地上看法律書的姿勢，很放鬆，沒有在演。重點是前面那位。

cos 成步堂的那位，演二十歲的版本。抱膝，嘟嘴，眼睛紅紅的，像剛哭完，整個人縮成一團，身邊堆著一疊一疊的法律書和測驗卷。

然後我開始拆。

第一，縮。膝蓋抬高、肩膀內收、下巴埋進去，所有會讓人顯大的線條全部往內收。
第二，對比物。後面坐著一個放鬆展開的成年人，一對比，前面那個就更小。
第三，書。這條我花了最久才看出來：那堆法律書和測驗卷，比正常尺寸大了一圈。不是大很多，大概就是你看了會覺得「這本書怎麼有點大」、但又說不出哪裡怪的程度。我是靠後面那位手上的那本才抓到的，他拿的是正常大小，兩邊的書背高度對不上。放大道具讓人顯小是最老的招，我自己也用過，但我從來沒用得這麼不著痕跡過。他縮在一堆「稍微太大」的東西中間，你的腦袋會自己幫他縮水，根本不會去檢查書的尺寸。
第四，角度。從稍微偏高的位置往下拍，人縮在畫面下半。

四個加起來，他真的小了一圈。可是我認得出每一個手法，認得出了還是會被騙，這才是我整晚睡不著的原因。我做魔術的人，被同行騙了。

然後我翻到下一張，地上散了一地的信。

我停了很久。

那些信封是泛黃的，有年代感的那種。我是玩道具的人，仿舊噴出來的和真的放過很多年的，差在哪我看得出來。我不是說這些一定是什麼，我只是盯著那些信封看了很久，數到一半停下來，因為我發現自己在數什麼。

再往後翻是書房。

御劍坐在辦公桌前，戴著眼鏡，低頭在看什麼。畫面另一側，椅背後面，探出一個人。

笑得非常陽光，整個人躲在椅子後面，只露出臉，一臉「我要嚇你一跳」的表情。

這張也是我拆到最後的一張。他整個人被椅子遮住了，你完全看不出完整身型，所以你不知道他有沒有縮。我拿出尺來比（對，我真的拿尺），還是比不出來。這是很標準的遮擋。

而 cos 御劍的那位，戴著眼鏡，耳朵到脖子整片紅。我不知道那是妝還是真的，但這張要是我來拍，我會要他「不要笑」，因為他一笑就破功。

反過來的那組，cos 成步堂的那位站在書櫃前，壁咚二十歲的御劍，還抬他下巴。這張我反而一分鐘就拆完了：他就只是站得比較高一點點，高那麼一點，壓迫感就出來了，沒有別的機關。

但我拆完還是盯著看，因為那個表情。笑得很輕，眼神是看準了獵物的那種。我看過的成步堂（公開露面的、新聞上的）從來沒有這種臉，這完全是那位 coser 自己的詮釋，我只是個看照片的。可是這就是視線管理最基本的一條：稀有的東西自己會把視線吸走。所有人都在看那張臉，沒有人在看他站在哪。

被壁咚的二十歲御劍，整個炸毛，cos 他的那位根本不用演。

最後是沙發那張，普通的四十歲對四十歲。一個翹腳喝紅茶，一個臉上蓋著書、腳直接翹到對方腿上，睡得沒心沒肺。

我做魔術十年，一直在騙別人。拿到這本書我才知道，最難騙的是「想被騙的自己」。

攝影掛名 N.M.，我不確定是誰，這兩個字母我也不打算亂猜。但拍的人一定懂視線管理，這點我敢簽名。`,

  title:'[心得] 單身五年的我 看完主冊街角章 被日常擊沈 現在很想要那本花絮小冊', au:'lonely_traveler', nick:'單身五年的出差族', date:'03/25', t:[0,20],
  body:`先說我是什麼狀態：單身五年，工作常出差，回家燈是暗的，沒有人說「回來啦」，我已經很習慣了。

主冊其實早就寄到了，但我這趟出國五天，包裹就在大樓保全那裡放著。今天晚上回來，行李都還沒拆，先跑去保全室領。拿到那個小箱子的時候，我是真的開心，因為這是我期待了好幾個月的東西，是這五天裡唯一有東西等我的地方。

我回到家，燈還是暗的，但我這次沒在意，因為手上有包裹。

我是拆開來就坐在玄關地上翻的。

前面幾章，我真的是一路笑著翻過去的。天使惡魔，餐廳，然後是年差章，那章糖度高到我翻到一半去喝了杯水。每一頁都看得出很認真在做，雖然是兩個人，可是每一張都是造好型、搭好景的，兩個人各自在「扮演」某個情境，幸福到讓人羨慕，但身為 cp 粉，我是滿足，不是難過。我是很開心地吃糧。

我翻到街角章，後面還有最後一章，所以我想說，這章應該也是差不多的，但是，我完全想錯了。

街角篇的開篇是日景，背景看得出是佈景搭的街角，沒有什麼細節，也不用有。cos 成步堂的那位，手上拿著一張機票，另一手幫旁邊的人拖行李箱，一邊指著遠處，像是在問路，不知道是在問路人，還是問身旁那位。看起來像是要往哪裡出發。

旁邊 cos 御劍的那位，手插在口袋裡，臉埋在圍巾裡，紅色的。他沒有要幫忙，什麼都沒有在幫。他只是調整了一下圍巾，瞄了成步堂一眼，縮著脖子，整個人一臉「我好冷」。

我翻到下一張，同一個角度。

成步堂還在指、還在問，御劍已經靠過去了。整個人往成步堂肩膀上靠，眼睛閉著，圍巾蓋到鼻子。

他沒有要回答，也沒有要湊過去幫忙確認，他就是沒睡飽，想要那個肩膀。

這一頁跟前面所有章節都不一樣。前面的他們是「在演」，這一頁他們是「在過」。沒有任何一個人在看鏡頭，沒有任何一句台詞，只有一個人在問路、一個人在睡，兩個人都很自然，因為這就是他們平常的樣子。

我就是在這一頁被擊沈的。

我以為被日景擊沈已經是極限了，翻頁之後才發現，夜景才是補刀。

夜景的第一張，路燈，暖色的。cos 御劍的那位一個人拖著行李箱，像是剛從遠方回來，走進路燈照出來的那一圈光裡，整個人帶著一點風塵僕僕的疲倦。

我翻下一頁，畫面的另一側，cos 成步堂的那位已經站在街角了，像是等了一陣子。他看著御劍走過來，沒有說話，只是把自己脖子上那條紅圍巾解了下來。

再下一張，他把圍巾繞上了御劍的脖子。

御劍整個人是微微僵住的，不是不願意，是來不及反應。他一隻手還抓著行李箱的把手沒放，圍巾就已經上來了。

我看到這裡才想起來，日景那條紅圍巾，我一直在想是哪來的，原來是這條。我知道書裡的順序不一定是這樣，可是我自己把它們接在一起了：他剛從遠方回來，在街角被圍上圍巾，然後一起出發，一路上一個指路、一個靠著睡。

我把書翻回街角那頁，又看了一次，然後停在那裡。後面還有最後一章，純白法庭，我知道在那邊，我沒有翻。我怕。我怕我撐不住。

然後我想到一件事。

早鳥的時候我沒買。我當時想，一本主冊就夠了，花絮小冊應該就是整裝跟調整姿勢的那種東西，不用特地搶。

我現在真的後悔了。街角這章拍成這樣，花絮裡是不是還有更多？一般通販不附，現場不賣，我只能一遍一遍刷早鳥組的開箱文，看他們花四十分鐘看一頁，我連那一頁是什麼都不知道。

我抬頭看了一下，家裡的燈還是暗的。

我想要那本小冊。真的很想要。`,

{
  title:'[心得] 午休在公司翻開主冊第一章 我需要一個沒有人的地方', au:'lunch_break_fan', nick:'午休翻書翻到社死的人', date:'03/26', t:[13,10],
  body:`主冊今天寄到公司了。我不知道當初為什麼要填公司地址，大概是想說反正收件人在，不會漏掉。

午休時間，茶水間，我一個人，我想說我先翻一章就好，下午才有力氣上班。

我打開第一章，奇幻景。

第一頁是天使惡魔的雙人合影。cos 成步堂的那位是天使，白翅膀，笑得很標準；cos 御劍的那位是惡魔，黑色披風，角，尾巴，站在暗處。這頁很正常，很好看，我還想說，這樣的開頭很溫和。

我翻到第二頁，惡魔的尖牙就咬在天使的脖子上了。

天使一隻手摸著惡魔的頭，沒有躲，也沒有推開，那個摸頭的動作，像是「好啦好啦，乖」。惡魔咬著，眼睛是閉著的。

哇靠，這本整本都要這麼猛的嗎？！我嚇得把書闔上，環顧四周。確定茶水間沒有人後，我才再把書翻開。

下一頁，天使把失去意識的惡魔公主抱起來。惡魔整個人軟軟地垂在他懷裡，手也垂下來，頭靠在天使的肩膀上，天使低頭看著他。翅膀還撐著，像是要把兩個人都護住。

這一頁我真的看了很久。我不知道為什麼，一個失去意識的惡魔被天使抱著，會讓我有種很安心的感覺，像是「你終於可以休息了，我在這裡」。

然後是躺下來的那組。

兩個人躺在地上，方向是相反的，頭對頭，上下顛倒，但臉對著臉。天使在上，惡魔在下，兩個人都笑著。這一組不是那種「擺好的笑」，是真的在笑。拍的人應該也很開心，因為這組拍了好幾張，每一張的笑法都不一樣。其中有一張，兩個人都笑到眼睛瞇起來了，明顯是憋不住。我猜是因為第一次看到對方化這麼濃的妝，還是臉貼臉的近拍，誰也撐不住。

  body:`先講一下我的狀況，我是御劍粉，吃的就是這一對。第一章福利章翻到尖牙咬脖子那一頁的時候，我是直接把書闔起來，跑去倒了杯水，冷靜完才敢回來繼續翻的。

我現在要收回這句話。

餐廳章一開始是門口景。家庭餐廳風格的佈景，燈光亮亮的，玻璃門上還貼著菜單海報，普通到一點都不高級。我記得公告有寫過，這是展場門口 coser 拍照區的其中一個板塊，所以應該是他們先去佈景工房拍的。畫面裡兩個人像是剛下班，穿著招牌的西裝但只穿了一半，外套不是掛在手臂上就是掛在椅背上，整個感覺就是「今天辛苦了，找個東西吃吧」。我看到這張真的鬆了一口氣，因為終於不是咬來咬去的畫面了。

{
  title:'[分析] 來818 檢察官跟律師在一起 一般人要看什麼 才能判斷這案子乾不乾淨',
  au:'back_row_regular', nick:'旁聽席後排的常客', date:'03/31', t:[22,15],
  body:`前幾天我媽看完新聞，很認真地問我：檢察官跟律師住在一起，是不是就能把情報賣給對方？我愣了一下，發現我旁聽這麼多年，居然答不出來。

先說我不是法律人，只是旁聽很多年的一般人，下面是我這幾天查資料加上自己的觀察，有講錯的請直接糾正我。

一般人怕的其實就兩件事，冤獄，還有壞人說謊脫罪。民事官司輸贏只是錢的問題，刑事是一個人會不會被關，所以這邊的緊張感完全不一樣。

首先是判決只看證據。刑事訴訟法寫明事實的認定要靠證據，而且有罪要證明到沒有合理的懷疑才行，所以就算有人私下透露了什麼，那個消息本身不是證據，要等它被擺上法庭、被對造質問過，才有資格拿來判斷。成步堂律師的庭審之所以難懂，從來不是因為他空口講話，他每次都把證據一件一件實際拿出來，十幾件也是一件一件放上去，難的是一開始你根本想像不到 A 跟 Z 有什麼關係，等他解釋完才突然全部接起來。更讓我手心冒汗的是，他拿出來的東西有時候反而讓局勢更糟，我在後排看過好幾次，但矛盾就是矛盾，他還是會拿出來。所以我現在看庭審，會問自己一件事：他解釋完之後，我能不能從結論一步一步退回去，每一步都找得到一個被拿出來的證據。

也是因為這樣，我覺得這件事比有沒有洩密更有說服力。法律上寫的是無罪推定，要由檢察官證明有罪，可是日本的有罪率長期都在九成九以上，很多人的感覺其實是反過來的，在這種地方，能拿到無罪判決的案子，很難是矇出來的，而是那個人本來就沒有做。反過來說，有罪的人找他一點好處也沒有，他不是那種幫你爭取最輕刑度的律師，有時候甚至可能讓你受到更重的刑，所以就算真的有人想靠洩密換錢，我也想不出來找他能換到什麼。

第二是律師能拿到的資料本來就有範圍。正式開庭前有一個公判前整理程序，由法院主持，檢察官要先說明預定要證明什麼、要請求調查哪些證據，而且依規定要把特定類型的證據開示給辯護方。程序結束之後，要再追加新證據是有限制的，而且這個限制對雙方都一樣。也就是說律師手上有什麼，是由程序決定的，不是看他認識誰。

第三是案子不是一個人說了算。我找到法務省網站上一篇由某地檢次席檢事寫的說明，裡面提到案件的處理要經過決裁，也就是好幾層的人看過才定案，不過那是某一個地檢署的寫法，別的地方不一定一樣。另外檢察廳法第十二條寫的是首長可以自己接手或改派檢察官的案子，這部分是我自己的推論：如果有一天其中一方變成局長，這條就代表他更需要被大家看到「沒有碰那個案子」，因為他是有這個權力的。

第四是說謊有代價。偽證罪的刑責是三個月到十年，比我想的重很多。真實發生過的例子也有，埼玉那邊有檢察官把前科資料洩漏給交往的對象，被判略式命令罰款三十萬日圓，之後也被懲戒免職，所以洩密這件事不是沒人管。

最後是公開。憲法規定審判要在公開法庭進行，再加上我們本來就愛看庭審，能公開的庭基本上都有直播，也有錄影存檔，想重看哪一庭、哪一個證據是怎麼被拿出來的，隨時都找得到，不用特別申請。換句話說，上面那個「退回去每一步都找得到證據」的檢查，不是只有我們這些常客能做，任何人回放一次就能自己確認。

我媽看完這篇之後說她也想去旁聽，我說可以，但法庭裡面不能吃零食。`,

  body:`※ 引述《back_row_regular (旁聽席後排的常客)》之銘言：
: 前幾天我媽看完新聞，很認真地問我：檢察官跟律師住在一起，是不是就能把情報賣給對方？

樓上這題我上週也被室友問過，她的版本是「他們這樣不是犯規嗎」。我是法律系三年級，不是律師，當時我先去查的是另一個方向：到底有沒有條文在擋他們。結論是沒有，我覺得可以補在樓上這篇旁邊。

日本法裡沒有一條明文寫檢察官不能跟律師交往。刑事訴訟法的除斥、忌避、迴避（第 20 條那一串）寫的對象是法官和書記官，我查到的條文裡沒有同一套是給檢察官的，所以不會有「因為認識所以自動排除」這種事。律師那邊的利益衝突規定（律師法第 25 條、職務基本規程第 27、28 條）管的是律師跟委託人、對造之間的關係，也不是律師的私生活。我看的報導裡，前東京地檢的律師也說檢察組織不干涉檢察官的私生活，會被處罰是因為洩漏職務上知道的資訊，不是因為談戀愛。

所以樓上寫的那幾件事，其實就是這個空缺被補起來的地方：證據要擺到法庭上、開示的範圍由程序決定、案子要過決裁、說謊有偽證罪、庭審公開。條文沒有叫他們避開對方，是整個制度讓私下講了也沒用。我讀完之後的感想是，這跟要不要禁止戀愛是兩回事，法律管的是職務上知道的事能不能外流。

{

  au:'law_junior', nick:'被室友追問的法律系三年級', date:'04/02', t:[7,40],
  body:`我室友昨天整天在問：這樣不是犯規嗎？我昨天晚上回家，真的一條一條拆了，結論是一條都沒有。我不是律師，下面是我的理解，講錯的請前輩糾正。

第一句，公關婚姻。這句話其實有兩種讀法，一種是用公關湊成的婚姻，一種是他在宣傳他結婚了，我們全部都只讀到第一種。詐欺罪要成立，要有人因為被騙而交出財物，昨天沒有任何人被騙走一毫錢，連一個字都沒有假。

第二句，公關照。照片是真的，公關的是這趟行程，不是他們兩個人的關係，所以公關這個詞也沒有說錯。

再來是誰發的。發照片的是美貫的帳號，不是成步堂本人，更不是御劍。成步堂的私人帳號想發什麼就發什麼，頂多是弁護士法第 56 條說的品位問題，但要說一個愚人節玩笑有失品位，我想不到怎麼論證。

最後是御劍。他全程只發了一隻狗，暱稱換成美貫的名字，可是暱稱本來就不是名字，他什麼聲明都沒有說，公務員該顧慮的信用，他一個字都沒碰到。

所以我昨天晚上的結論是：三個人沒有一個人說謊，全部都是我們自己讀錯。我室友聽完說，他們三個如果不是正派的人，現在應該已經是詐騙集團了。`,

{
  title:'[心得] 第二批到貨 欠的心得來還了 整本主冊沒有人在吃飯',
  au:'kitchen_fox',
  nick:'第二批終於到貨了',
  date:'05/01',
  t:[22,40],
  body:`先說一下，這篇是欠週末攝影師的。展場那天他把書借給我，條件是看完要寫一篇心得，結果我在長椅上翻得太快，翻完只在推文裡丟了幾句「停了五分鐘」就把書還回去，回家打開電腦才發現自己只記得幾個畫面，根本寫不出東西，所以我跟他說，等我自己那本到了再寫。今天第二批終於到貨，這篇就是那時候欠下來的。

順便自首一件事。聖誕節那天我在預購串說我已經預購了，其實那天我只是把它放進購物車，結帳頁面跳出來的時候，我媽剛好在樓下喊吃飯，我關掉手機就下樓了，接下來是一整個月的打包，等我想起來已經是二月中。那一週的白飯配醬菜倒是真的有吃，只是省下來的錢最後拿去付了搬家公司。

會講這個，是因為我發現自己讀這本書的方式跟板上大家都不太一樣，而這件事大概跟我家有關。

我家講話的方式很簡單，什麼事都用吃來講。考試考差了，我媽問的是吃飯了沒；跟朋友吵架，她問晚上要不要煮我愛吃的；我說要搬出去住，她沉默了很久，最後問的是新家的廚房有沒有瓦斯爐。我在板上三句不離吃，被吐槽了不知道幾年，我自己也一直以為那只是嘴饞，直到這次一個人坐在新家的地板上，把主冊從頭翻到尾，才發現我一直在找的，是書裡的人有沒有好好吃飯。

然後我發現，整本主冊沒有一個人在吃飯。

以下為了打字方便，我直接叫他們成步堂跟御劍，指的當然是兩位 coser，大家懂的。

第一章奇幻景，茶水間社死的部分午休那位已經講過了，我不重複，我想講的是第二頁跟第三頁接在一起看的樣子。惡魔咬上天使的脖子，天使一隻手摸著他的頭，沒有躲，到了下一頁，惡魔失去意識，被天使公主抱起來，翅膀撐開護著兩個人。大家都說這組很猛，我也同意，可是我第一眼想到的不是吸血鬼，是我爸。他以前加班到很晚，回家常常飯吃到一半就趴在餐桌上睡著，我媽也不叫醒他，等他睡一會兒再把他扶回房間。一個人撐了一整天，終於吃到東西，吃完就倒了，而旁邊那個人讓他咬，也接住他倒下來。所以我看那張公主抱，看到的不是天使抓住了惡魔，是有一個人終於肯讓自己被照顧。

第二章是餐廳。展場那天我坐的長椅就在這個佈景旁邊，看了一整個早上的人在那張桌子前面拍照，所以翻到這章的時候，有種回到現場的感覺。門口那張兩個人剛下班，外套掛在手臂上，接著坐下來各拿一本菜單，再來就是那條餐巾。老實說我第一眼看到的不是領巾，是圍兜，看到那個抬起來的下巴，才知道他在學誰，再翻一頁，對面那位已經氣到臉紅，手上還捏著菜單。

這章我來回翻了好幾次，最後確定了一件事：桌上沒有盤子。菜還沒來，兩個人點完了，在等。等菜是一頓飯裡最無聊的一段，大部分的人會滑手機，或是沒話找話，而這一章從頭到尾拍的就是那一段，有一個人不想讓另一個人在那幾分鐘裡又想起工作，所以把餐巾圍到脖子上。這可能是我想太多，但那天在現場，排隊拍這個佈景的人，桌上也一直是空的，沒有一組想到要擺吃的上去。

第三章年差，小一圈的部分魔術師講完了，我拆不出來，也不打算拆，我想講的是最後沙發那一張。四十歲對四十歲，一個翹著腳喝紅茶，另一個臉上蓋著書，腳直接翹到對方腿上睡著。我在這頁停了很久，因為我翻了兩遍，確定這杯紅茶是整本主冊裡唯一入口的東西（咬脖子不算的話）。前面有二十歲的哭臉、地上泛黃的信、書房裡探頭嚇人、書櫃前抬下巴，一路翻下來，年輕的時候每一張都在拉扯，要一直到四十歲，才終於有一個人坐下來好好喝杯東西，另一個人可以在旁邊放心地睡。我搬出來三個月，晚餐幾乎都是對著電腦吃超商便當，那是我第一次覺得一杯紅茶可以讓人這麼羨慕。

第四章街角，單身五年那位寫的那篇我看了很多次，他讀的順序是先在夜裡回來、被圍上圍巾，再一起出發，一路上一個問路一個靠著睡。我在長椅上第一次翻的時候也是這樣讀的，可是今天書到了，我在家多看了幾遍，才注意到日景裡只有一個行李箱，成步堂手上也只有一張機票。

所以我換了一個讀法。日景是早上，要出門的只有御劍，成步堂幫他拖箱子、拿機票、替他問路，而御劍什麼都沒在幫，是因為他不是要跟誰一起出發，他是要被送走，所以最後那幾分鐘，他把頭靠在那個肩膀上。夜景是同一個街角，他一個人拖著箱子回來，早上送他的那個人已經站在那裡等了。

這樣讀，那條紅圍巾就說得通了。早上它在御劍的脖子上，晚上它在成步堂的脖子上，然後在路燈下，又被繞回御劍的脖子。那條圍巾一直都在要出門、或是剛回來的那個人身上，待在家裡等的人用不到它。在我家，這件事叫做帶便當，出門的人身上一定要帶著家裡的一樣東西。我搬家那天，我媽塞給我一袋飯糰，我坐在新家空蕩蕩的地板上吃完，當時沒覺得有什麼，今天翻到這頁才想起來。

我不是說單身五年那位讀錯了，他自己也說書裡的順序不一定是那樣，而我的讀法剛好就是照著書頁走的，先日景，再夜景。他是常常出差的人，所以看到的是兩個人一起出發，我是剛離家的人，所以看到的是有人在街角等。

最後是純白法庭，紅藍站位跟白西裝雙拍大家都講得很完整了，我只講雪景。額頭靠著額頭，戴著戒指的那隻手摸著對方的臉，兩個人都閉著眼睛，雪落在肩膀上。早鳥組那位一月的時候問過，主冊收的是小冊最後一頁那一秒的前，還是後。我沒有小冊，不知道那一頁長什麼樣子，照理說沒資格回答，可是如果讓我選，我想讓它接這一張，也就是碰到了。

看完之後，我把書放上新家書櫃空著的那一層，那一層空了三個月，終於有東西了。然後我去開了瓦斯爐，煮了搬家以來第一頓不是微波的晚餐，很普通的咖哩，一不小心煮太多，大概要吃三天。吃完我傳訊息跟我媽說吃過了，她回了一個好，過了一分鐘又補一句，咖哩不要放在外面過夜。

  title:'[創作] 《逆轉的告白》 聽完緘默權後寫的 賀兩週年',
  au:'slow_pen', nick:'寫很慢的人', date:'05/17', t:[21,47],
  body:`潛水很久，第一次發創作文。

去年 11 月看到詞曲太太的《緘默權》，被「你問我為什麼選的都是遠一點的店」那一段打到，所以那天晚上一直在想，如果這兩個人真的是這樣，那被拆穿的那天會是什麼樣子。後來就開始寫，寫寫停停，直到上個月才好不容易寫完。

本來沒打算特地挑日子貼，不過今天翻了一整天版面，大家都在等，結果正主跟往常一樣沒有任何動靜，所以我想，既然他們不發，那就讓我把這篇放出來當賀文吧。

──────────

《逆轉的告白》

御劍怜侍的皮鞋底敲擊著大理石地面，規律的喀喀聲在空曠的廊道中迴盪。他抬起手腕看了看錶——下午三點十五分，距離成步堂約定的時間還有五分鐘。走廊兩旁的窗戶灑進斜斜的陽光，在地面上拉出長長的光影。這個時間點所有法庭都應該休庭了，偌大的建築物裡只剩下零星的工作人員。

他皺起眉頭，心中浮現一絲不安。

成步堂龍一又在搞什麼把戲?電話裡那傢伙只說了句「有重要的事要告訴你，來特別法庭一趟」就掛斷了。語氣裡帶著某種御劍無法解讀的情緒——既不是平時那種輕鬆的調侃，也不像遇到棘手案件時的嚴肅。那聲音聽起來有些緊繃，卻又透著某種堅定。

御劍的步伐沒有因為疑惑而放慢。

他穿著筆挺的酒紅色西裝，領口的蕾絲領巾一絲不苟地繫著。即使只是應一個莫名其妙的約，他也不允許自己的儀容有半點鬆懈。這是他多年來建立起的防護——用完美的外表掩蓋內心那些不該存在的感情。

走廊盡頭的門牌上寫著「特別法庭」四個字。

御劍停在門前，深吸了一口氣。

他的手握上門把，金屬的觸感冰涼。推開門的那一刻，眼前的景象讓他愣住了。

法庭裡空無一人——不，應該說只有一個人。成步堂龍一站在檢察官席上，穿著他標誌性的藍色西裝，雙手撐在桌面上，就像御劍自己當年在法庭上的姿態。陽光從天窗灑落，在法庭中央形成一片明亮的光區，空氣中浮動著細微的塵埃。

「成步堂⋯⋯你到底在做什麼?」他的聲音比預期中更加沙啞。

成步堂抬起頭，那雙深邃的眼睛直直望向他。

那眼神裡有著御劍從未見過的東西——既溫柔又堅決，像是終於下定了某個重大的決心。法庭裡的寂靜被兩人的呼吸聲填滿，御劍能聽見自己的心跳聲在耳邊轟鳴。

「你站到那邊去。」成步堂開口了，聲音平穩，卻帶著不容置疑的力量。

御劍順著他手指的方向看去——那是被告席。

一瞬間，御劍的理智與情感在腦海中激烈碰撞。被告席?成步堂要他站到被告席上?這傢伙是瘋了嗎?他御劍怜侍是檢察局局長，骨子裡卻永遠是應該站在檢察官席上的人。可是那個位置現在被成步堂佔據了，而對方正用那種既認真又帶著某種期待的眼神看著他。

御劍的喉嚨發緊。

「你佔了我的位置。」他試圖讓聲音聽起來冷靜，卻發現自己的手指微微顫抖。

「我知道。」

成步堂的嘴角揚起一個淺淺的弧度。

那笑容裡沒有平時的玩笑意味，反而帶著某種赤裸的真誠。他沒有移動，只是靜靜地站在那裡，等待著御劍的反應。法庭裡的空氣彷彿凝固了，時間在這一刻變得黏稠而緩慢。

御劍的腳步不受控制地朝被告席走去。

每一步都像是踏在棉花上，腿部的肌肉繃得發疼。他告訴自己這很荒謬，告訴自己應該立刻轉身離開，但身體卻誠實地執行著成步堂的指令。當他站到被告席後面時，雙手本能地撐在欄杆上，指節因為用力而泛白。

從這個角度看過去，成步堂的身影被逆光勾勒出清晰的輪廓。

御劍的心臟幾乎要從胸腔裡跳出來。

「很好。」成步堂的聲音在空曠的法庭裡迴響。「現在，被告御劍怜侍⋯⋯」

他頓了頓，那雙眼睛裡燃燒著御劍從未見過的火焰。

「我現在要提出我們相愛的證據。」

御劍的世界在那一瞬間天旋地轉。

什麼?相愛?證據?這些詞彙在他腦海中炸開，每一個字都像是重錘敲擊在他精心築起的防線上。他張開嘴想說些什麼，卻發現喉嚨像是被什麼東西堵住了，發不出任何聲音。

耳邊傳來自己急促的呼吸聲，還有心臟劇烈跳動的聲響。陽光依舊灑落，塵埃依舊飄浮，但御劍怜侍的世界已經不再是三分鐘前的模樣了。

那個他隱藏了十幾年的秘密，那份他以為永遠只能埋在心底的感情，此刻正被成步堂龍一用最直接的方式攤開在陽光下。

御劍的指尖死死扣著被告席的木質欄杆，木頭的紋路硌得掌心生疼。他能感覺到自己的臉在發燙，那是多年來習慣性壓抑情緒後難得出現的生理反應。腦海中有個聲音在尖叫著——快逃，立刻離開這裡，不要聽下去。

但他的雙腿像是被釘在地上，動彈不得。

「異議⋯⋯」他終於找回自己的聲音，卻發現那聲音虛弱得可笑。「成步堂，你在胡說八道些什麼？」

成步堂沒有回答，只是從公事包裡抽出一份文件。

那動作熟練得就像他平時在法庭上提出證物一樣。紙張在空氣中發出細微的沙沙聲，成步堂將文件舉高，讓御劍能清楚看見上面的內容——那是一份通話記錄清單。

「證物一號。」成步堂的聲音平穩而清晰。「這是我們過去三年的通話記錄。」

御劍瞳孔微縮。

「你會發現，」成步堂繼續說道，手指滑過那些密密麻麻的數字。「即使沒有案件需要討論的日子，我們平均每週還是會通話五次以上。每次通話時長超過四十分鐘。」

他抬起頭，那雙眼睛直直望進御劍的靈魂深處。

「御劍，你能解釋為什麼每次通話結束前，你總會停頓三秒才掛斷電話嗎？」

御劍的呼吸停滯了。

該死。那三秒鐘的停頓——那是他每次都忍不住想說些什麼，卻又硬生生吞回去的時刻。他以為成步堂從未注意到，以為那些微小的猶豫都被掩藏得很好。原來這個男人一直都知道，一直都在數著那些秒數。

「那、那只是⋯⋯」御劍試圖辯解，卻發現自己根本找不到合理的藉口。

成步堂放下第一份證物，又拿起另一個文件夾。

「證物二號。」他翻開文件夾，裡面是一疊照片。「這些是過去五年來，我們一起用餐的餐廳收據。」

御劍看著那些熟悉的店名——那家義大利餐廳、轉角的咖啡店、河邊的日式料理店。每一個地點都烙印在他的記憶裡，每一次約會⋯⋯不，不能叫約會，每一次見面都是他小心翼翼珍藏的片段。

「你有沒有發現，」成步堂的聲音變得更加溫柔。「這些餐廳都不在法院附近，也不在我們各自的辦公室周圍。它們都在城市的另一端，需要特地搭車前往的地方。」

御劍的心臟揪緊了。

那些地點都是他精心挑選的——遠離熟人的視線，遠離可能遇到同事的風險。他以為自己選擇那些餐廳只是為了避免不必要的麻煩，但現在被成步堂這樣說出來，那些選擇背後的心思顯得如此透明。

「而且你知道最有趣的是什麼嗎？」成步堂向前走了一步，離開檢察官席。

他的腳步聲在空曠的法庭裡格外清晰，每一步都像是踩在御劍的心上。陽光灑在成步堂的側臉上，讓他的輪廓看起來既溫柔又堅定。御劍發現自己無法移開視線，就像過去這麼多年來一樣。

「每次選餐廳的都是你。」成步堂停在法庭中央，距離御劍只有幾步之遙。「每次都是你傳訊息說『那家店不錯』、『換個地方吧』。你從來不讓我們去同一家店超過兩次。」

御劍的呼吸變得急促。

他想反駁，想說那只是因為他喜歡嘗試新餐廳，但連這個藉口都顯得蒼白無力。事實是他害怕——害怕在同一個地方出現太多次會被人發現什麼，害怕店員記住他們的臉，害怕有人看出他看向成步堂時眼神裡的渴望。

「成步堂⋯⋯」他的聲音顫抖著。「你⋯⋯這些都不能證明什麼。」

「是嗎？」

成步堂又走近了一步。

現在他們之間只隔著被告席的欄杆，御劍能聞到成步堂身上熟悉的氣息——混合著洗衣精的清香和淡淡的古龍水味。那是他無數次在法庭上、在並肩辦案時聞過的味道，是他深夜輾轉難眠時會想起的氣息。

「那麼證物三號。」成步堂從西裝內袋掏出一個小小的物件。

那是一支鋼筆——御劍認得那支筆。那是他三年前送給成步堂的生日禮物，一支價格不菲的萬寶龍鋼筆。筆身上刻著成步堂的名字縮寫，在光線下泛著低調的金屬光澤。

「你知道這支筆我用了多久嗎？」成步堂輕輕撫過筆身。「三年。我每天都用它簽署文件、做筆記、寫辯護詞。即使墨水用完了，我也會立刻換上新的墨水匣繼續使用。」

他抬起頭，眼神溫柔得讓御劍幾乎無法承受。

「你知道為什麼嗎？因為每次握著這支筆，我都能想起你送它給我時的表情。」

御劍的視線模糊了。

御劍猛地別過頭，不讓成步堂看見自己眼眶泛紅的模樣。他的手指更用力地扣緊欄杆，指甲幾乎要嵌進木頭裡。那支筆——他記得自己當時只是淡淡地遞過去，說了句「生日快樂」就匆匆離開了。他不敢多停留，不敢讓成步堂看見自己挑選那支筆時的糾結與期待。

他在店裡站了整整兩個小時，比較每一支筆的重量、墨水流暢度、握感。

最後選了這支深藍色的萬寶龍，因為那個顏色讓他想起成步堂西裝的顏色。他甚至特地要求店員刻上縮寫，想像著成步堂每次使用時都會看見那些字母。但他從來沒想過，這個男人真的會每天用它，會珍惜到這種程度。

「別說了。」御劍的聲音啞得厲害。「這些⋯⋯這些都只是你的片面解讀。朋友之間也會⋯⋯」

「朋友？」

成步堂打斷了他，聲音裡第一次出現了一絲痛楚。

他將鋼筆放回口袋，雙手撐上被告席的欄杆。現在他們之間只隔著一道木製的屏障，御劍能清楚看見成步堂眼底的情緒——那裡有多年的壓抑、有不甘、有渴望，還有一種讓御劍心臟緊縮的溫柔。

「御劍，你真的認為我們只是朋友嗎？」

成步堂的聲音很輕，卻重重砸在御劍心上。

法庭裡的寂靜變得沉重，連陽光灑落的聲音都彷彿清晰可聞。御劍的呼吸變得急促，他想後退，想逃離這個讓他無所遁形的空間，但成步堂的目光將他牢牢釘在原地。那雙眼睛裡映著他的倒影，映著他多年來小心隱藏的所有情感。

「那些深夜的電話裡，你跟我聊案件、聊天氣、聊那些根本不重要的瑣事。」成步堂繼續說道。「有時候你什麼都不說，只是靜靜聽著我說話。你以為我不知道嗎？每次我問你『還在嗎』，你總會立刻回答『在』。」

御劍的喉嚨像是被什麼東西哽住了。

那些深夜時分——當整個世界都安靜下來，當他終於可以卸下局長的面具，他會躺在床上聽著成步堂的聲音。有時候成步堂會說起今天遇到的趣事，有時候只是抱怨辦公室的咖啡機又壞了。而御劍就那樣聽著，聽著那個聲音在黑暗中溫柔地包圍他。

他以為那些時刻只屬於自己一個人的秘密，原來成步堂也同樣清醒著，同樣珍惜著那些對話。

「還有那些餐廳。」成步堂的聲音變得更加溫柔。「你每次選的位置都在角落，都是光線昏暗的地方。你以為我沒注意到嗎？你總是坐在面對牆壁的那一側，讓我背對著餐廳的其他客人。」

御劍的心臟幾乎停止跳動。

「那是因為⋯⋯」他想辯解，卻發現自己說不出任何理由。

「因為你想看著我，卻不想被別人看見你看我的眼神。」

成步堂替他說完了那句話。

御劍渾身一震，像是被人狠狠撕開了最後一層防護。他的臉燒得發燙，那些被精心掩飾的小心思、那些自以為隱藏得很好的渴望，全都被成步堂一一揭穿。他突然意識到，這個男人比他想像中更了解他，了解到讓人害怕的程度。

陽光移動了位置，現在直直照在御劍臉上。

他無處可躲。

「我⋯⋯我不知道你在說什麼。」御劍的聲音幾乎是哀求了。「成步堂，你這樣⋯⋯這樣胡攪蠻纏是想證明什麼？」

「證明你愛我。」

成步堂說得如此直白，如此坦然。

那四個字在空氣中炸開，震得御劍耳鳴。他張開嘴想反駁，想用盡一切方法否認，但喉嚨裡只發出一聲破碎的呼吸聲。他的視線開始模糊，那些壓抑了十幾年的情感在胸腔裡翻湧，幾乎要將他吞沒。

「你不能⋯⋯」他的聲音在顫抖。「你不能這樣⋯⋯」

「為什麼不能？」

成步堂突然繞過欄杆，走到御劍身邊。

他的動作很慢，像是給御劍足夠的時間逃開。但御劍沒有動，他只是僵硬地站在那裡，看著成步堂一步步靠近。當成步堂站在他面前時，兩人之間的距離近得可以感受到彼此的體溫。

「御劍怜侍。」成步堂輕聲喚著他的名字。「你知道今天是什麼日子嗎？」

御劍愣住了，腦海中一片空白。

「今天，日本全國同性婚姻正式合法了。」成步堂的聲音裡帶著一絲顫抖。「這意味著，我終於可以不用再假裝了。我終於可以告訴你——」

他伸出手，指尖輕輕碰觸御劍緊握著欄杆的手背。

那觸碰輕得像是羽毛掠過，卻在御劍的皮膚上燙出一道火痕。他渾身顫抖，所有的理智都在這一刻瓦解。成步堂的手指溫暖而堅定，與他冰冷僵硬的手形成鮮明對比。陽光灑在兩人交疊的手上，將那個畫面渡上一層溫柔的光暈。

御劍想抽回手，卻發現自己動不了。

「證物四號。」成步堂的聲音低沉而溫柔。

他緩緩俯身，動作慢得讓御劍有足夠的時間推開他。但御劍只是睜大眼睛，看著那張熟悉的臉孔越來越近。成步堂的呼吸噴灑在他臉上，帶著淡淡的薄荷味。他能看見成步堂睫毛的每一根弧度，能看見那雙眼睛裡倒映著自己慌亂的模樣。

然後，柔軟的觸感落在他唇上。

那是一個輕柔得近乎虔誠的吻。

成步堂沒有深入，沒有索取，只是將嘴唇輕輕貼在御劍唇上。那觸感溫暖而真實，帶著小心翼翼的試探。御劍的腦海一片空白，心臟在胸腔裡狂跳，整個世界都在這一刻靜止了。

法庭裡只剩下兩人細微的呼吸聲，還有陽光灑落時空氣中塵埃飄動的聲響。

時間彷彿被拉長了，又彷彿只是一瞬間。

當成步堂離開時，御劍發現自己的雙腿在發軟。他死死抓著欄杆才沒讓自己倒下去，胸口起伏劇烈，呼吸急促得像是剛跑完一場馬拉松。他的嘴唇還殘留著成步堂的溫度，那觸感真實得讓他無法否認。

成步堂退開一步，但沒有走遠。

他就站在那裡，雙眼直直望進御劍的靈魂深處。那眼神裡沒有得意，沒有勝利的喜悅，只有赤裸的真誠和多年積累的情感。法庭裡的光線在他臉上投下柔和的陰影，讓他看起來既熟悉又陌生。

「我愛你。」

三個字，清晰而堅定。

御劍感覺自己的世界徹底崩塌了。那些他用盡全力築起的牆、那些他告訴自己絕對不能逾越的界線，全都在這三個字面前化為灰燼。他張開嘴想說些什麼，卻發現喉嚨像是被什麼東西堵住了，只能發出破碎的氣音。

眼淚在眼眶裡打轉，模糊了視線。

「成步堂⋯⋯」他的聲音嘶啞得可怕。「你⋯⋯你怎麼可以⋯⋯」

怎麼可以這樣做？怎麼可以把他隱藏了這麼多年的感情攤開在陽光下？怎麼可以用這麼溫柔的方式摧毀他所有的防線？御劍想質問，想憤怒，但湧上心頭的情緒卻是壓抑了太久的委屈和渴望。

成步堂沒有回答，只是靜靜看著他。

那眼神裡有理解、有心疼，還有一種讓御劍幾乎承受不住的溫柔。法庭裡的空氣變得黏稠，每一次呼吸都像是在水中掙扎。御劍的手指緊緊扣著欄杆，指節泛白，彷彿那是唯一能讓他保持清醒的支撐點。

「你知道我等這一天等了多久嗎？」成步堂輕聲說道。

他的聲音裡帶著一絲顫抖，那是御劍從未聽過的脆弱。

「從小學開始，從那個午後你為我辯護開始，從我們在法庭上第一次對峙開始⋯⋯」成步堂的眼眶也泛紅了。「我一直在等。等一個可以名正言順說出這句話的機會。」

御劍的視線完全模糊了。

那些記憶如潮水般湧來——雨天濕透的制服、法庭上針鋒相對的辯論、無數次並肩辦案的夜晚。每一個片段都烙印在他心裡，每一次相遇都是他偷偷珍藏的寶藏。原來成步堂也記得，原來這個男人也在等待。

「我不能⋯⋯」御劍的聲音幾乎是哀求。「我們不能⋯⋯這樣⋯⋯」

  body:`之前說過要去度蜜月，但因為還沒結婚，所以今天落地的這趟只能算蜜月前哨。賀文那天我還在收行李，是在機場等登機的時候才把推文一則一則補完的。

  body:`官宣那時候，我在新聞上看到御劍這個名字，愣了一下，心想這不就是小學那個轉學走的同學嗎？結果也就愣了那一下，日子還是照過。一直到上個月朋友丟了這個板的連結給我，我才知道原來大家這麼認真在討論他們。所以這幾天我下班就從兩年前的文章一路往後翻，翻到現在，終於忍不住辦了帳號。

先說清楚，那已經是快三十年前的事了，我連當時坐我隔壁的人叫什麼都想不起來，能記得的只有幾個很模糊的畫面，大家看看就好。

我記得的御劍，跟現在新聞上看到的其實差不多，只是放在一群小學生裡面，就特別像個小大人。下課大家都衝出去玩，他一個人坐在位子上看一本很厚的書，那本書我連書名都看不懂。有一次體育課他跌倒，膝蓋擦破一大片，結果他一聲都沒哭，自己站起來走去保健室。反而是跟在旁邊的成步堂哭得比他還慘，哭到最後還要御劍回頭安慰他。

對，那時候的成步堂跟現在完全不一樣，他是班上很悶的那種小孩，常常被欺負，也不太會替自己講話。他跟另一個男生（名字我真的想不起來了）每天都黏在御劍旁邊，我那時候看了就覺得很煩。現在想想，一個小學同學會記得這麼清楚，大概就是偷偷喜歡過人家吧，所以才會那麼在意旁邊那兩個人。

後來御劍轉學了，我們誰也沒有他的消息，我大概不到一年就把他忘得差不多，又去喜歡別人了。小學生的喜歡本來就是這樣，所以我一直以為大家都一樣。

結果翻到一半，看到有人提到他們小學時班上有過一場審判，說成步堂被冤枉偷了午餐錢，是御劍站出來替他講話。我看到的時候第一個反應是「有這回事嗎？」，想了很久才隱約記得好像真的有，班上吵過一陣子，可是對我們這些坐在旁邊的人來說，那就只是某一天下午的事，隔天大家就忘了。所以後來再看到大家整理出成步堂寫了十五年的信，最後還為了他跑去當律師，我整個人坐在電腦前面愣了很久。一樣是坐在那間教室裡的小孩，我差點連人家的名字都忘了，他卻一路追到法庭上，我到現在還是不太能理解他的腦迴路。

所以只是想上來說一聲，當年那個哭得比跌倒的人還慘的小孩，後來真的追到了。`,

  body:`今天法界日報放了官宣後兩位的第一張同框照，是法曹三者座談會結束後主辦方要求的合照。我看到的時候人還在公司，直接把它設成手機桌布，還拿給坐隔壁的同事看，說這就是我嗑了六年的 CP。

  body:`我兒子下個月生日，他最近迷上大將軍超人，我上網查到玩具店今天開賣限量公仔，每人限購兩個，所以特地請了半天假，凌晨三點半就去排隊，原本以為我已經夠早了。

{
  title:'[閒聊] 來818御劍局長上任以來的這幾年做了多少改革',
  au:'law_junior', nick:'備考中的人', date:'06/09', t:[23,40],
  body:`水桶期間我有很多時間，所以一直在想一件事：局長上任之後到底動了哪些制度？先聲明，這不是在逃避考試，這是在整理刑訴法的實務動向，對短答很有幫助。

一、偵訊錄影。以前只有重大案件才全程錄影，後來擴大到所有起訴案件，據說局長的理由是「錄影是為了保護檢察官自己」。

二、證據提前開示。起訴前先把主要證據整理成清單給辯方，這項對辯護人影響最大，所以我想問，局長是故意讓對手變強的嗎？

三、不起訴理由書詳細化。以前一頁，現在最少三頁，而且要寫出為什麼沒有發現其他可能性。

四、新人檢察官必須旁聽辯方開庭。局長自己以前就旁聽過，後來變成制度。

五、證物驗真制度。重要物證出庭前，要經過檢辯共同指定的第三方簽章，來源和經手紀錄都要留下。這項沒有溯及既往，所以對過去的案件不適用。我整理判例的時候一直想到，當年有一個人，紀錄裡沒有替自己辯護過任何一句，他覺得提出了就是提出了。所以這個制度的重點，不是事後怎麼免責，而是不要再讓人只能這樣扛，我就說到這裡。

整理到這裡，我才發現這些改革有一個共通點，就是每一項都在要求檢察官自己先找出被告可能被誤判的地方。至於是什麼樣的經驗讓局長變成這樣，我想大家心裡都有答案。

最後，這篇是我照意見書的格式練習寫的，因為論文式就要這樣寫。有人要幫我看嗎？`,

  au:'legalnews', nick:'法律新聞轉載員', date:'07/05', t:[12,30],
  body:`1.媒體來源：法務時報

4.完整新聞連結：https://www.homu-times.example/news/0705-0017
5.備註：本報前日預告之後續報導 全文如下。

針對近日某案庭審中檢察官於旁聽席主動說明、後出庭作證一事 檢察廳今日中午發表聲明 全文如下：

「一、該名檢察官係以個人身分旁聽 其說明及作證均依法為之 與執行職務無涉 經核對門禁紀錄 其陳述屬實。
二、辯護人於庭上對任一證人皆適用相同標準 本廳對辯護人之職業操守表示敬意。

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const boardView = $('#boardView');
let mode = 'list', sel = articles.length - 1, cur = -1;
function score(a){ return a.pushes.reduce((n,p)=> n + (p[0]==='推'?1:p[0]==='噓'?-1:0), 0); }
function scoreHtml(n){
  if(n >= 14) return '<span class="s-bao">爆</span>';
  if(n >= 10) return `<span class="s-hot">${n}</span>`;
  if(n > 0) return `<span class="s-ok">${n}</span>`;
  if(n < 0) return '<span class="s-bad">X</span>';
  return '';
}
function fmtTime(a, i, p){
  if(p && p[3]) return p[3].includes('/') ? p[3] : `${a.date} ${p[3]}`;
  const m = a.t[0]*60 + a.t[1] + 2 + i*3;
  return `${a.date} ${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}
function setKeys(html){ $('#keys').innerHTML = html; }
function renderList(){
  mode = 'list'; cur = -1;
  $('#subL').textContent = '看板《Doujin》逆轉同人討論區';
  let h = '<div class="head" aria-hidden="true"><span></span><span>編號</span><span>推</span><span>日期</span><span class="hau">作者</span><span>文章標題</span></div>';
  articles.forEach((a,i)=>{
    h += `<button class="row${i===sel?' sel':''}" data-i="${i}">
      <span class="cur">${i===sel?'›':''}</span>
      <span>${a.ann?'★':i+1}</span>
      <span>${scoreHtml(score(a))}</span>
      <span>${a.date}</span>
      <span class="au">${esc(a.au)}</span>
      <span class="tt${a.ann?' ann':''}">${esc(a.title)}</span></button>`;
  });
  h += '<div class="foot-hint">鄉民討論的是官宣之後的同人圈。點選文章閱讀，或用 ↑↓ 與 Enter。</div>';
  boardView.innerHTML = h;
  setKeys('(<span>↑↓</span>)選擇 (<span>Enter</span>)閱讀');
  const r = boardView.querySelector('.row.sel'); if(r) r.scrollIntoView({block:'nearest'});
}
function pushLine(ty,id,tx,tm,me){
  const c = ty==='推'?'pu':ty==='噓'?'bo':'ar';
  return `<div class="push${me?' me':''}"><span class="ty ${c}">${esc(ty)}</span><span class="id">${esc(id)}:</span><span class="tx">${esc(tx)}</span><span class="tm">${esc(tm)}</span></div>`;
}
function renderArticle(i){
  mode = 'article'; cur = i; sel = i;
  const a = articles[i];
  $('#subL').textContent = `看板《Doujin》 · 文章 ${a.ann?'★':i+1}`;
  const pushHtml = a.pushes.map((p,k)=>pushLine(p[0],p[1],p[2],fmtTime(a,k,p),false)).join('');
  boardView.innerHTML = `<article class="art">
    <div class="hd"><span class="lb">作者</span><span class="v">${esc(a.au)} (${esc(a.nick)})</span></div>
    <div class="hd"><span class="lb">看板</span><span class="v">Doujin</span></div>
    <div class="hd"><span class="lb">標題</span><span class="v">${esc(a.title)}</span></div>
    <div class="hd"><span class="lb">時間</span><span class="v">${a.date} ${String(a.t[0]).padStart(2,'0')}:${String(a.t[1]).padStart(2,'0')}</span></div>
    <div class="rule"></div>
    <div class="body">${a.body.split('\n').map(l=>{const m=l.match(/^\[圖 ([A-Za-z0-9_-]+)\]$/);if(m){return `<div style="margin:8px 0"><img src="img/${m[1]}.jpg" alt="" style="max-width:100%;height:auto;display:block;border:1px solid #555"></div>`;}return `<div${/^※ 引述/.test(l)?' class="qh"':/^:/.test(l)?' class="q"':''}>${esc(l)||'&nbsp;'}</div>`;}).join('')}</div>
    <div class="sig" style="margin-top:12px">--</div>
    <div class="sig">※ 發信站: 逆轉BBS(bbs.gyakuten.tw), 來自: 同人誌展會場</div>
    <div class="sig">※ 文章網址: https://bbs.gyakuten.tw/Doujin/M.${2000+i}.html</div>
    <div class="pushes" id="pushes">${pushHtml}</div>
    <form class="pf" id="pf">
      <select id="ptype" aria-label="推文類型"><option>推</option><option>噓</option><option>→</option></select>
      <input type="text" id="ptext" maxlength="50" placeholder="寫下你的推文" autocomplete="off">
      <button class="btn" type="submit">送出</button>
      <button class="btn" type="button" id="back">← 返回看板</button>
    </form>
  </article>`;
  setKeys('(<span>q / ←</span>)返回看板 (<span>↑↓</span>)上下篇');
  window.scrollTo(0,0);
}
boardView.addEventListener('click', e=>{
  const row = e.target.closest('.row');
  if(row){ renderArticle(+row.dataset.i); return; }
  if(e.target.id === 'back'){ renderList(); }
});
boardView.addEventListener('submit', e=>{
  if(e.target.id !== 'pf') return;
  e.preventDefault();
  const t = $('#ptext').value.trim(); if(!t) return;
  const now = new Date();
  const tm = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  $('#pushes').insertAdjacentHTML('beforeend', pushLine($('#ptype').value,'你',t,tm,true));
  $('#ptext').value = '';
});
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(mode === 'list'){
    if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, sel-1); renderList(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(articles.length-1, sel+1); renderList(); }
    else if(e.key === 'Enter' || e.key === 'ArrowRight'){ renderArticle(sel); }
  } else {
    if(e.key === 'q' || e.key === 'ArrowLeft' || e.key === 'Escape'){ renderList(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); renderArticle(Math.max(0, cur-1)); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); renderArticle(Math.min(articles.length-1, cur+1)); }
  }
});
function clock(){ const d=new Date(); $('#clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
clock(); setInterval(clock, 30000);
renderList();
</script>
